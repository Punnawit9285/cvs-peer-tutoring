CVS.add({"id":"F","short":"Frog heart lab","title":"Lab: Heart Contraction &amp; Extrasystole (frog)","kind":"Lab","blurb":"Sequence of contraction, refractory periods, extrasystole and compensatory pause, Stannius ligatures and the all-or-none law.","items":[
{"t":"c","id":"F-C1","title":"What we did with the frog heart","src":"Lab direction &#183; lab slide","html":"<div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/hb-9-1.png\" width=\"882\" height=\"280\" alt=\"Fig 9-1 asks you to name phases A and B of the ventricular tracing.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 9-1 asks you to name phases A and B of the ventricular tracing. <span class=\"src\">Heart block lab manual, Fig 9-1</span></figcaption></figure><div class=\"mini\"><h4>Read every tracing in this lab the same way</h4><p>A, the downstroke = {{diastole}}. B, the upstroke = {{systole}}. The flat bottom is the relaxed, refilled ventricle. (Fig 9-2 marks early systole at the foot of an upstroke and early diastole at the peak.)</p></div></div><ul class=\"pts\"><li><b>Exp 1 &#183; observe</b>: rate &#8776; 56/min. Systole looks {{pale}}, diastole looks {{darker}} (refilled). Order: {{sinus venosus &#8594; atria &#8594; ventricle}}.</li><li><b>Exp 2 &#183; extrasystole</b>: shock the ventricle at different moments of the beat.</li><li><b>Exp 3 &#183; Stannius ligatures</b>: tie the SA junction (crescentic line), then the AV junction.</li><li><b>Exp 4 &#183; all-or-none</b>: stimulate the quiet ventricle with increasing current.</li><li>Frog and turtle hearts have no {{coronary circulation}}, so ligatures do not cause ischemia.</li></ul>"},
{"t":"tf","id":"F1","src":"Lab quiz","core":true,"q":"Turtle&#8217;s sinus venosus is comparable to the SA node in humans.","a":true,"ex":"The sinus venosus fires fastest and starts every beat, which is the SA node&#8217;s job in humans."},
{"t":"c","id":"F-C2","title":"Three kinds of cardiac cells and two kinds of action potential","src":"Lab slide","html":"<div class=\"cols3\"><div class=\"mini\"><h4>Pacemaker cells</h4><p>SA node, AV node. Generate the impulse ({{automaticity}}).</p></div><div class=\"mini\"><h4>Conducting cells</h4><p>Internodal pathways, bundle of His, bundle branches, Purkinje network.</p></div><div class=\"mini\"><h4>Contractile cells</h4><p>Atrial and ventricular muscle, joined by intercalated discs ({{gap junctions}}) into a <b>{{functional syncytium}}</b>.</p></div></div><div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/slide-fastap.png\" width=\"1302\" height=\"761\" alt=\"Fast response (atrial and ventricular muscle, Purkinje): rests near &#8722;90 mV; phase 0 rapid Na&#8314; influx; phase 2 plateau where K&#8314; efflux &#8776; Ca&#178;&#8314; influx.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fast response (atrial and ventricular muscle, Purkinje): rests near &#8722;90 mV; phase 0 rapid Na&#8314; influx; phase 2 plateau where K&#8314; efflux &#8776; Ca&#178;&#8314; influx. <span class=\"src\">Heart contraction &amp; vagus lab slides, p.5</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/slide-pacemaker.png\" width=\"1386\" height=\"677\" alt=\"Slow response (SA and AV node): no stable resting potential; phase 4 rises on the funny current, phase 0 is carried by Ca&#178;&#8314;.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Slow response (SA and AV node): no stable resting potential; phase 4 rises on the funny current, phase 0 is carried by Ca&#178;&#8314;. <span class=\"src\">Heart contraction &amp; vagus lab slides, p.4</span></figcaption></figure></div><div class=\"two\"><figure class=\"scan tall\"><div class=\"paperimg\"><img src=\"img/slide-conduction.png\" width=\"714\" height=\"988\" alt=\"The pacemaker&#8211;conduction system, numbered as on the slide.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>The pacemaker&#8211;conduction system, numbered as on the slide. <span class=\"src\">Heart contraction &amp; vagus lab slides, p.15</span></figcaption></figure><div class=\"stack\"><ol class=\"steps\"><li>{{SA node}}</li><li>{{Internodal / interatrial pathway}}</li><li>{{AV node}}</li><li>{{Bundle of His}}</li><li>{{Right and left bundle branches}}</li><li>{{Purkinje fibers}}</li><li>{{Ventricles}}</li></ol><p class=\"note\">Conduction velocity depends on the slope of phase 0. Fastest = {{His&#8211;Purkinje system}}; slowest = {{AV node}} (and SA node). The SA node is the primary pacemaker because it <b>{{fires fastest}}</b>.</p></div></div><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Site</th><th>Conduction velocity (lab slide)</th><th>Intrinsic rate</th></tr></thead><tbody><tr><td>SA node</td><td class=\"num\">{{0.05}} m/s</td><td>70&#8211;80/min, sinus rhythm</td></tr><tr><td>Atrial muscle</td><td class=\"num\">{{1.0}} m/s</td><td>&#8212;</td></tr><tr><td>AV node (relay station)</td><td class=\"num\">{{0.1}} m/s, delay &#8776; 0.1 s</td><td>40&#8211;60/min, nodal rhythm</td></tr><tr><td>Bundle branches / Purkinje</td><td class=\"num\">{{2.0 / 1.0}} m/s (textbooks: Purkinje 2&#8211;4)</td><td>20&#8211;40/min, ventricular rhythm</td></tr><tr><td>Ventricular muscle</td><td class=\"num\">{{0.4}} m/s</td><td>&#8212;</td></tr></tbody></table></div>"},
{"t":"q","id":"F2","src":"AC75","core":true,"q":"Which of the following is <b>NOT</b> an explanation of the SA node as the primary pacemaker?","o":["Located at the superior part of the right atrium","Resting membrane potential is unstable","Discharges faster","Spontaneous depolarization","High amount of Na+ funny channels"],"a":0,"ex":"Location makes no cell a pacemaker. SA cells lead because phase 4 depolarizes spontaneously (unstable potential, many funny channels), so they reach threshold first and overdrive-suppress the slower pacemakers."},
{"t":"q","id":"F3","src":"AC76","q":"ข้อไหนอธิบายได้ดีที่สุดว่าทำไม SA node ถึงเป็นตัวหลักในการสร้างจังหวะการเต้นของหัวใจ <span class=\"muted\">(Best explanation of why the SA node sets the rhythm?)</span>","o":["Depolarization can occur spontaneously","Unstable resting membrane potential","Located at the most superior part","Highest rate of firing","Numerous funny channels"],"a":3,"ex":"AV-node and Purkinje cells also depolarize spontaneously. What makes the SA node the leader is that it fires fastest (70&#8211;80 vs 40&#8211;60 vs 20&#8211;40/min)."},
{"t":"tf","id":"F4","src":"Lab quiz","q":"Cells in the AV node are the origin of cells in the bundle of His.","a":false,"ex":"The bundle of His is its own specialized conducting tissue; it is not derived from AV-nodal cells."},
{"t":"tf","id":"F5","src":"Lab quiz","q":"Cardiac muscle is a functional syncytium as the cardiomyocytes are functionally connected by intercalated discs.","a":true,"ex":"Gap junctions in the intercalated discs pass current from cell to cell, so the atria (and the ventricles) contract as one unit."},
{"t":"tf","id":"F6","src":"Lab quiz","q":"Cardiomyocytes have less density of mitochondria than skeletal muscle cells.","a":false,"ex":"Cardiomyocytes have more mitochondria: the heart works aerobically without rest."},
{"t":"c","id":"F-C3","title":"Refractory periods versus the twitch","src":"Lab slide","html":"<div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/slide-arp.png\" width=\"1288\" height=\"672\" alt=\"Absolute (ARP) and relative (RRP) refractory periods on the ventricular action potential.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Absolute (ARP) and relative (RRP) refractory periods on the ventricular action potential. <span class=\"src\">Heart contraction &amp; vagus lab slides, p.11</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/slide-elecmech.png\" width=\"1246\" height=\"777\" alt=\"Action potential (red) against the twitch: the ARP lasts almost until the muscle relaxes. SNP = supranormal period.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Action potential (red) against the twitch: the ARP lasts almost until the muscle relaxes. SNP = supranormal period. <span class=\"src\">Heart contraction &amp; vagus lab slides, p.9</span></figcaption></figure></div><ul class=\"pts\"><li><b>Excitability</b> = ability to fire an AP in response to a depolarizing current.</li><li><b>ARP</b> (phase 0 &#8594; mid phase 3, about &#8722;50 mV): {{Na&#8314; channels are inactivated}}; no stimulus of any size can fire the cell.</li><li><b>RRP</b>: an AP is possible, but needs {{more current than usual}}. A short {{supranormal}} period follows.</li><li>Because the ARP lasts about as long as the {{contraction}}, a second beat cannot fuse with the first: {{no tetanus}}, so the heart always relaxes and refills.</li></ul>"},
{"t":"tf","id":"F7","src":"Lab quiz","core":true,"q":"The absolute refractory period of cardiac muscle occurs only in the depolarization phase of the action potential.","a":false,"ex":"The ARP runs from phase 0 through the plateau into early phase 3, which is why it lasts about as long as the contraction."},
{"t":"tf","id":"F8","src":"Lab quiz","q":"Tetanic contraction is unlikely to occur in cardiac muscle because of a long refractory period of the action potential.","a":true,"ex":"The long ARP prevents summation, so each contraction is followed by relaxation."},
{"t":"q","id":"F9","src":"Lab slide","core":true,"q":"In the frog-heart lab a single shock is applied to the ventricle at four different moments: early systole, late systole, early diastole and late diastole. When does it produce an extrasystole?","o":["Early and late systole","Early and late diastole","Late diastole only","All four","Never: cardiac muscle cannot be re-excited"],"a":1,"ex":"Lab results: systole (early or late) = no extrasystole, because the ventricle is in its ARP. Diastole (early or late) = extrasystole, each followed by a compensatory pause."},
{"t":"c","id":"F-C4","title":"Extrasystole and compensatory pause","src":"Lab slide","html":"<figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/hb-9-2.png\" width=\"1312\" height=\"321\" alt=\"Fig 9-2: shocks at (1) early systole, (2) late systole, (3) mid systole, (4) late diastole, (5) early diastole and (6) mid diastole.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 9-2: shocks at (1) early systole, (2) late systole, (3) mid systole, (4) late diastole, (5) early diastole and (6) mid diastole. <span class=\"src\">Heart block lab manual, Fig 9-2</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Shock (Fig 9-2)</th><th>Extrasystole?</th><th>Compensatory pause?</th></tr></thead><tbody><tr><td>1, 2, 3 &#183; any time in systole</td><td>{{No}}</td><td>{{No}}</td></tr><tr><td>4, 5, 6 &#183; any time in diastole</td><td><b>{{Yes}}</b></td><td><b>{{Yes}}</b></td></tr></tbody></table></div><ul class=\"pts\"><li><b>No extrasystole in systole</b>: the extra stimulus falls in the myocyte&#8217;s {{ARP}}, whatever its strength.</li><li><b>Compensatory pause</b>: the next sinus venosus impulse reaches the ventricle while it is still {{refractory}} from the extrasystole, so it is lost. The ventricle waits for the following impulse, which keeps the overall rate unchanged. On the trace: the long flat stretch after each extra beat.</li><li><b>Different amplitudes</b> = different {{preload}}. The later in diastole, the more filling, the {{bigger}} the extrasystole. The beat after the pause is {{the strongest}}.</li><li>Extrasystoles happen with heart disease (e.g., myocardial infarction) and in healthy people (lack of sleep, heavy smoking, stress, caffeine).</li></ul>"},
{"t":"q","id":"F10","src":"AC75 &#183; AC79","core":true,"q":"Which of the following explains the occurrence of the <b>compensatory pause</b> after a ventricular extrasystole?","o":["The ectopic AP stimulates during the relative refractory period of the myocyte","The ectopic AP stimulates during the absolute refractory period of the myocyte","The primary pacemaker cannot generate an AP to conduct ventricular contraction","The primary pacemaker AP stimulates during the relative refractory period of the myocyte","The primary pacemaker AP stimulates during the absolute refractory period of the myocyte"],"a":4,"ex":"The SA node keeps firing on schedule. Its next impulse meets a ventricle that is still in the ARP of the extrasystole, so nothing happens until the impulse after that."},
{"t":"q","id":"F11","src":"AC78","q":"What causes a compensatory pause following an extrasystole?","o":["Refractory period of the extrasystole","Increased afterload following the extrasystole","Increased preload following the extrasystole","Increased heart rate","Decreased contractility after the extrasystole"],"a":0,"ex":"The extrasystole makes the ventricle refractory at the moment the next normal impulse arrives."},
{"t":"q","id":"F12","src":"AC77","flag":"Recall listed &#8220;absolute&#8221; in both b and c; one of them must have been &#8220;relative&#8221;. Shown corrected.","q":"Extrasystole can result from&#8230;?","o":["Atrioventricular junction blockage","An electrical signal from ectopic foci stimulating myocytes in the absolute refractory period","An electrical signal from ectopic foci stimulating myocytes in the relative refractory period","Increased automaticity of the AV node","Increased automaticity of the SA node"],"a":2,"ex":"An extrasystole is a premature beat from an ectopic focus that fires once the ARP is over (relative refractory period or later). A stimulus inside the ARP does nothing. A faster SA node gives sinus tachycardia, not premature beats."},
{"t":"q","id":"F13","src":"AC78","core":true,"q":"In an extrasystole, the amplitude of the contraction varies when stimulated at different times. What is the most likely explanation?","o":["Different preload","Different afterload","Different contractility","Timing of the stimulation","Strength of the current"],"a":0,"ex":"The lab answer is preload: a later stimulus means a longer filling time, a bigger EDV and a stronger contraction (Frank&#8211;Starling). Timing is what changes the preload; current strength does not matter (all-or-none)."},
{"t":"q","id":"F14","src":"AC80","core":true,"q":"In a pressure tracing, a stimulus causes an extrasystole at point Y. Point X (a normal beat) is marked on the Frank&#8211;Starling diagram. Where should Y be?","fig":"<figure class=\"scan tall\"><div class=\"paperimg\"><img src=\"img/ac80-starling.png\" width=\"888\" height=\"1273\" alt=\"AC80 exam figure\" loading=\"lazy\" decoding=\"async\"></div><figcaption class=\"srconly\"><span class=\"src\">AC80 exam figure</span></figcaption></figure>","o":["A","B","C","D","E","F"],"a":2,"ex":"The premature beat comes before the ventricle has filled, so EDV is lower, but contractility has not changed. Slide left along the <b>same</b> control curve: C. A or E would need a change in inotropy; D would need more filling."},
{"t":"q","id":"F15","src":"AC81","q":"Stimuli are applied to the frog ventricle at four points on the tracing. Which produces the extrasystole with the <b>highest amplitude</b>?","fig":"<figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/ac81-stim.png\" width=\"936\" height=\"497\" alt=\"AC81 exam figure\" loading=\"lazy\" decoding=\"async\"></div><figcaption class=\"srconly\"><span class=\"src\">AC81 exam figure</span></figcaption></figure>","o":["Point A with threshold intensity","Point B with maximal intensity","Point B with threshold intensity","Point C with maximal intensity","Point D with subthreshold intensity"],"a":0,"ex":"Read the trace the way the lab manual does (Fig 9-1, 9-2): the upstroke is systole; the downstroke and the flat bottom are diastole. <b>B</b> sits on an upstroke and <b>C</b> at the top, so both fall in systole, inside the ARP: even a maximal shock does nothing. <b>D</b> is late diastole, the best moment for a big beat, but a subthreshold stimulus fires nothing. <b>A</b> is on the downstroke (diastole), so a threshold shock gives an extrasystole. It is the only one on offer, so it is also the biggest. A matches the AC81 answer key.","core":true},
{"t":"tf","id":"F16","src":"Lab quiz","q":"Extrasystole can occur without pathology in the heart.","a":true,"ex":"Stress, caffeine, alcohol, fatigue and smoking can all trigger benign extrasystoles."},
{"t":"c","id":"F-C5","title":"Stannius ligatures: who takes over as pacemaker?","src":"Lab slide","html":"<div class=\"cols2\"><div class=\"tblwrap\"><table class=\"tbl\"><caption>Ligature I at the sino-atrial junction</caption><thead><tr><th></th><th>Sinus venosus</th><th>Atria</th><th>Ventricle</th></tr></thead><tbody><tr><td>Before</td><td class=\"num\">60</td><td class=\"num\">60</td><td class=\"num\">60</td></tr><tr><td>Just after</td><td class=\"num\">60</td><td class=\"num\">{{0}}</td><td class=\"num\">{{0}}</td></tr><tr><td>Later</td><td class=\"num\">60</td><td class=\"num\">{{32}}</td><td class=\"num\">{{32}}</td></tr></tbody></table></div><div class=\"tblwrap\"><table class=\"tbl\"><caption>Ligature II at the AV junction</caption><thead><tr><th></th><th>Sinus venosus</th><th>Atria</th><th>Ventricle</th></tr></thead><tbody><tr><td>Before</td><td class=\"num\">60</td><td class=\"num\">32</td><td class=\"num\">32</td></tr><tr><td>Just after</td><td class=\"num\">60</td><td class=\"num\">32</td><td class=\"num\">{{0}}</td></tr><tr><td>Later</td><td class=\"num\">60</td><td class=\"num\">32</td><td class=\"num\">{{0}}</td></tr></tbody></table></div></div><ul class=\"pts\"><li>Each ligature is a <b>{{heart block}}</b>: the impulse cannot cross.</li><li>After ligature I the atria stop, then restart at a slower rate: a latent pacemaker below the block shows {{automaticity}} once it escapes {{overdrive suppression}}.</li><li>In patients whose SA node fails, the <b>{{AV node}}</b> usually takes over (junctional rhythm {{40&#8211;60}}/min, narrow QRS). If the block is lower, Purkinje fibers take over ({{20&#8211;40}}/min). Whichever latent pacemaker {{fires fastest}} wins.</li></ul>"},
{"t":"q","id":"F17","src":"AC79","core":true,"q":"ทำ SA block ในกบ ตอนแรกไม่เต้น แต่ต่อมา atrium เต้น สื่อให้เห็นว่า atrium มีคุณสมบัติอะไร <span class=\"muted\">(After an SA block the frog heart stops, then the atrium beats again. Which property does this show?)</span>","o":["Automaticity","Lusitropy","Excitability","Rhythmicity","Conductivity"],"a":0,"ex":"Beating again without any input from the sinus venosus means the tissue can generate its own impulses: automaticity."},
{"t":"q","id":"F18","src":"AC75","core":true,"q":"A 70-year-old man has dyspnea. ECG shows 50 bpm with regular narrow QRS complexes, but P waves are abnormal. SA node abnormality is diagnosed. Which structure is the pacemaker in this patient?","o":["AV node","Bundle branch","Purkinje fiber","Atrium","Ventricle"],"a":0,"ex":"50/min with narrow QRS is a junctional (AV nodal) escape rhythm: the impulse starts above the bundle branches, so the ventricles depolarize normally. A ventricular or Purkinje escape would be 20&#8211;40/min with wide QRS."},
{"t":"c","id":"F-C6","title":"All-or-none law","src":"Lab slide","html":"<div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/hb-9-3.png\" width=\"1024\" height=\"328\" alt=\"Fig 9-3: the quiet ventricle shocked with increasing current.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 9-3: the quiet ventricle shocked with increasing current. <span class=\"src\">Heart block lab manual, Fig 9-3</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Stimulus to the quiet ventricle</th><th>Contraction</th></tr></thead><tbody><tr><td>Subthreshold</td><td>{{None}}</td></tr><tr><td>Threshold</td><td>{{Full contraction}}</td></tr><tr><td>Submaximal, maximal, supramaximal</td><td>{{Same size as at threshold}}</td></tr></tbody></table></div></div><ul class=\"pts\"><li>The cardiac AP is {{all-or-none}}, and the whole syncytium fires together, so a bigger shock does not give a bigger beat.</li><li>The smallest effective stimulus is the one that brings the membrane to the <b>{{threshold potential}}</b>.</li><li>Force <b>can</b> change by other routes: {{preload}} (Frank&#8211;Starling), {{contractility}} (catecholamines, Ca&#178;&#8314;, digitalis), temperature, pH, ions.</li></ul>"},
{"t":"q","id":"F19","src":"AC77","core":true,"q":"Which of the following is the lowest potential required for left ventricular contraction?","o":["Subthreshold","Threshold","Submaximum","Maximum","Supramaximum"],"a":1,"ex":"Threshold is the minimum; anything above it gives the same contraction (all-or-none)."}
]});
CVS.add({"id":"T","short":"Turtle vagus lab","title":"Lab: Vagus Nerve &amp; Heart Block (turtle)","kind":"Lab","blurb":"Right versus left vagus, the ganglion at the crescentic line, nicotine and atropine, and graded heart block.","items":[
{"t":"c","id":"T-C1","title":"Autonomic wiring of the heart","src":"Lab slide","html":"<div class=\"two\"><figure class=\"scan tall\"><div class=\"paperimg\"><img src=\"img/slide-control.jpg\" width=\"930\" height=\"1170\" alt=\"Autonomic wiring of the heart: cardioinhibitory (vagal) and cardioacceleratory centers in the medulla, the sympathetic ganglia and the cardiac plexus.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Autonomic wiring of the heart: cardioinhibitory (vagal) and cardioacceleratory centers in the medulla, the sympathetic ganglia and the cardiac plexus. <span class=\"src\">Heart contraction &amp; vagus lab slides, p.28</span></figcaption></figure><div class=\"stack\"><div class=\"mini ven\"><h4>Parasympathetic</h4><p>Dorsal motor nucleus of vagus / nucleus ambiguus &#8594; long preganglionic <b>vagus</b> &#8594; ACh on {{nicotinic}} receptors in a ganglion on the heart (turtle: {{crescentic line}}) &#8594; short postganglionic fiber &#8594; ACh on {{M2}} at the SA node (mostly {{right}} vagus) and AV node (mostly {{left}} vagus).</p></div><div class=\"mini art\"><h4>Sympathetic</h4><p>RVLM (cardioaccelerator) &#8594; spinal cord {{T1&#8211;T4}} &#8594; cervical/stellate ganglia (nicotinic) &#8594; long postganglionic fiber &#8594; NE on {{&#946;1}} at the SA node, AV node and ventricles. The adrenal medulla adds circulating epinephrine.</p></div></div></div><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Effect on the heart</th><th>Sympathetic</th><th>Parasympathetic</th></tr></thead><tbody><tr><td>Chronotropic (rate)</td><td class=\"up\">{{&#8593;&#8593;}}</td><td class=\"dn\">{{&#8595;&#8595;}}</td></tr><tr><td>Inotropic (force)</td><td class=\"up\">{{&#8593;&#8593;}}</td><td class=\"dn\">{{&#8595;}}</td></tr><tr><td>Dromotropic (conduction)</td><td class=\"up\">{{&#8593;&#8593;}}</td><td class=\"dn\">{{&#8595;&#8595;}}</td></tr><tr><td>Action potential duration</td><td class=\"dn\">{{&#8595;}}</td><td class=\"up\">{{&#8593;}}</td></tr></tbody></table></div><ul class=\"pts\"><li>The vagus is active {{at rest}} (vagal tone): the intrinsic SA rate is ~{{100}}/min but resting HR is ~70.</li><li>Vagal fibers go mainly to the {{atria and nodes}}; ventricles are mostly sympathetic.</li><li>ACh &#8594; more K&#8314; leaves the cell &#8594; membrane more negative ({{hyperpolarized}}) + flatter phase 4 &#8594; slower rate.</li></ul>"},
{"t":"tf","id":"T1","src":"Lab quiz","core":true,"q":"Parasympathetic nervous system stimulation makes the cardiac membrane potential more negative.","a":true,"ex":"ACh on M2 opens K+ channels (IK-ACh). K+ efflux hyperpolarizes the nodal cell and slows its depolarization."},
{"t":"tf","id":"T2","src":"Lab quiz","q":"At rest, there is NO activity in the vagus nerve.","a":false,"ex":"Vagal tone is continuous; it keeps resting HR below the intrinsic SA rate."},
{"t":"tf","id":"T3","src":"Lab quiz","q":"If the sympathetic nerves that supply the heart are destroyed, HR could NOT increase following physiologic changes.","a":false,"ex":"HR can still rise by withdrawal of vagal tone and by circulating catecholamines from the adrenal medulla."},
{"t":"tf","id":"T4","src":"Lab quiz","q":"The amount of vagal fibers supplying the ventricles is greater than the other parts of the heart.","a":false,"ex":"Vagal fibers are concentrated on the atria, SA node and AV node. The ventricles are dominated by sympathetic fibers."},
{"t":"c","id":"T-C2","title":"Right vagus versus left vagus","src":"Lab slide","html":"<div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/hb-9-4.png\" width=\"1384\" height=\"611\" alt=\"Fig 9-4: stimulating the right vagus.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 9-4: stimulating the right vagus. <span class=\"src\">Heart block lab manual, Fig 9-4</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/hb-9-5.png\" width=\"1328\" height=\"645\" alt=\"Fig 9-5: tying, cutting, then stimulating the left vagus.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 9-5: tying, cutting, then stimulating the left vagus. <span class=\"src\">Heart block lab manual, Fig 9-5</span></figcaption></figure></div><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Peripheral (cardiac) end stimulated</th><th>Right vagus</th><th>Left vagus</th></tr></thead><tbody><tr><td>Before / after tying / after cutting</td><td>60 &#183; normal force &#183; A:V 1:1</td><td>60 &#183; normal force &#183; A:V 1:1</td></tr><tr><td>Weak current</td><td>Rate and force &#8595; &#183; A:V {{1:1}}</td><td>Rate and force &#8595; &#183; A:V {{&gt; 1:1}} (dropped ventricular beats)</td></tr><tr><td>Moderate current</td><td>{{Arrest}} (0)</td><td>Markedly &#8595; &#183; A:V &gt; 1:1</td></tr><tr><td>Strong current</td><td>Arrest</td><td>Arrest</td></tr></tbody></table></div><ul class=\"pts\"><li><b>Right vagus &#8594; {{SA node}} &#8594; {{rate}}</b> (chronotropic): bradycardia, then arrest.</li><li><b>Left vagus &#8594; {{AV node}} &#8594; {{conduction}}</b> (dromotropic): the atria keep beating faster than the ventricle = {{AV block}}.</li><li>Why: the two vagi send unequal numbers of fibers to the SA and AV nodes. Humans show the same pattern.</li><li>Cutting the nerve changed nothing in this turtle preparation, and the heart recovers when stimulation stops.</li></ul>"},
{"t":"tf","id":"T5","src":"Lab quiz","core":true,"q":"Stimulating the right vagus nerve produces an equivalent effect to stimulating the left one.","a":false,"ex":"Right vagus mainly slows the SA node (bradycardia). Left vagus mainly slows the AV node (AV block)."},
{"t":"q","id":"T6","src":"AC78","core":true,"q":"During surgery, a surgeon accidentally compresses the <b>left vagus nerve</b>. What is the most likely consequence?","o":["Heart block","Increased heart rate","Hypertension","Decreased gastrointestinal motility","Bronchodilation"],"a":0,"ex":"Mechanical compression or traction stimulates the nerve. The left vagus mainly supplies the AV node, so AV conduction slows or blocks."},
{"t":"q","id":"T7","src":"AC78","q":"What is the effect of stimulating the vagus nerve in a dog?","o":["Increased heart rate","Increased blood pressure","Decreased heart rate","Increased contractility","Vasoconstriction"],"a":2,"ex":"Vagal ACh on M2 receptors slows the SA node (and the AV node); BP falls with the cardiac output."},
{"t":"tf","id":"T8","src":"Lab quiz","q":"Manipulation of the intestines during surgery can cause decreased heart rate.","a":true,"ex":"Traction on the gut triggers a vagal reflex that slows the heart."},
{"t":"c","id":"T-C3","title":"Where is the synapse? Nicotine at the crescentic line","src":"Lab slide","html":"<div class=\"flow\"><div class=\"fbox\">Stimulate the <b>vagus trunk</b><br><span class=\"muted\">preganglionic fibers</span></div><div class=\"farrow\">&#8594;</div><div class=\"fbox ven\"><b>Ganglion at the crescentic line</b><br>ACh &#8594; <b>{{nicotinic}}</b> receptor</div><div class=\"farrow\">&#8594;</div><div class=\"fbox\">Postganglionic fiber<br>ACh &#8594; <b>{{M2}}</b> at SA/AV node</div><div class=\"farrow\">&#8594;</div><div class=\"fbox end\">&#8595;HR or arrest</div></div><figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/hb-9-6.png\" width=\"1248\" height=\"464\" alt=\"Fig 9-6: no stimulus (HR 46/min), vagus stimulation, crescentic-line stimulation.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 9-6: no stimulus (HR 46/min), vagus stimulation, crescentic-line stimulation. <span class=\"src\">Heart block lab manual, Fig 9-6</span></figcaption></figure><div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/hb-9-7.png\" width=\"1248\" height=\"419\" alt=\"Fig 9-7: nicotine, low dose then high dose.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 9-7: nicotine, low dose then high dose. <span class=\"src\">Heart block lab manual, Fig 9-7</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/hb-9-8.png\" width=\"1248\" height=\"487\" alt=\"Fig 9-8: vagus and crescentic-line stimulation after nicotine.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 9-8: vagus and crescentic-line stimulation after nicotine. <span class=\"src\">Heart block lab manual, Fig 9-8</span></figcaption></figure></div><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Condition</th><th>HR, atria = ventricle (bpm)</th></tr></thead><tbody><tr><td>No stimulus</td><td class=\"num\">46</td></tr><tr><td>Stimulate vagus</td><td class=\"num\">{{0}}</td></tr><tr><td>Stimulate crescentic line</td><td class=\"num\">{{0}}</td></tr><tr><td>Nicotine, low dose</td><td class=\"num\">{{40}}</td></tr><tr><td>Nicotine, high dose</td><td class=\"num\">{{50}}</td></tr><tr><td>Stimulate vagus 2&#8211;3 min after nicotine</td><td class=\"num\">{{50}}</td></tr><tr><td>Stimulate crescentic line after nicotine</td><td class=\"num\">{{0}}</td></tr></tbody></table></div><ul class=\"pts\"><li><b>Low dose</b> {{stimulates}} the ganglionic nicotinic receptors &#8594; more ACh at the SA node &#8594; the heart slows.</li><li><b>High dose</b> keeps the postganglionic neuron depolarized; its Na&#8314; channels inactivate ({{depolarization block}}). The ganglion stops transmitting: resting vagal tone is lost (the heart speeds up a little) and vagal stimulation can no longer get through.</li><li>Stimulating the crescentic line still stops the heart because it fires the postganglionic neurons {{below the block}}. So the synapse is at the {{crescentic line}}.</li><li><b>Atropine</b> blocks {{M2}}: neither vagus nor crescentic-line stimulation can slow the heart.</li></ul>"},
{"t":"tf","id":"T9","src":"Lab quiz","core":true,"q":"The vagus nerve contains cholinergic preganglionic fibers that synapse on cardiac parasympathetic ganglia through muscarinic receptors.","a":false,"ex":"Ganglionic transmission uses nicotinic receptors. Muscarinic (M2) receptors are on the nodal cells, after the postganglionic fiber."},
{"t":"q","id":"T10","src":"AC77","core":true,"q":"What is the mechanism of action of <b>low-dose nicotine</b>?","o":["Stimulation of adrenergic receptors","Stimulation of dopaminergic receptors","Stimulation of nicotinic receptors","Stimulation of muscarinic receptors","None of the above"],"a":2,"ex":"Nicotine is an agonist at nicotinic ACh receptors; at the vagal ganglion this fires postganglionic neurons and slows the heart."},
{"t":"q","id":"T11","src":"AC76 &#183; AC79","core":true,"q":"Which is a result of applying <b>high-dose nicotine</b> on the crescentic line?","o":["Depolarization block at nicotinic receptors","Inhibition of muscarinic receptors","Stimulation of muscarinic receptors","Stimulation of nicotinic receptors"],"a":0,"ex":"Persistent nicotinic activation holds the postganglionic membrane depolarized, so Na+ channels stay inactivated and the neuron cannot fire."},
{"t":"tf","id":"T12","src":"Lab quiz","q":"Nicotine has either a stimulating or an inhibitory effect on the nicotinic acetylcholine receptor (nAChR).","a":false,"ex":"The answer key says false: nicotine is an agonist and mainly stimulates nAChR. The &#8220;inhibition&#8221; seen at high dose is a depolarization block that results from excessive stimulation, not antagonism at the receptor."},
{"t":"q","id":"T13","src":"AC79","core":true,"q":"In an experiment on a turtle&#8217;s heart after applying a <b>low dose</b> of nicotine, what is the expected change in heart rate from stimulation of (1) the vagus nerve and (2) the crescentic line?","o":["Increase, decrease","Decrease, no change","No change, no change","No change, decrease","Decrease, decrease"],"a":4,"ex":"A low dose stimulates the ganglion but does not block it, so both vagal and crescentic-line stimulation still slow the heart. Only a high dose blocks the vagal route (then the answer becomes &#8220;no change, decrease&#8221;)."},
{"t":"q","id":"T14","src":"AC80","core":true,"q":"High-dose nicotine is applied to the synapse at the crescentic line, then the vagus nerve is stimulated. Compared with the baseline before nicotine, what is the change in heart rate (1) after high-dose nicotine and (2) during vagal stimulation?","o":["Increase, increase","Increase, no change","Increase, decrease","Decrease, increase","Decrease, decrease"],"a":0,"ex":"Lab data: baseline 46 &#8594; high-dose nicotine 50 (resting vagal tone blocked) &#8594; vagal stimulation still 50. Both values are above the pre-nicotine baseline. Relative to the post-nicotine state the vagal stimulation causes no change, which is why option B is a trap."},
{"t":"q","id":"T15","src":"AC81","core":true,"q":"In a turtle experiment a &#946;1 agonist increases heart rate. Which of the following elicits the same response?","o":["Apply low-dose nicotine on the crescentic line","Apply high-dose nicotine on the crescentic line","Direct electrical stimulation at the crescentic line"],"a":1,"ex":"High-dose nicotine blocks the ganglion, removes resting vagal tone and raises HR (46 &#8594; 50). Low-dose nicotine and direct stimulation both slow the heart."},
{"t":"q","id":"T16","src":"AC75","q":"In an experiment on autonomic control of the heart, which test <b>cannot</b> demonstrate bradycardia/asystole from parasympathetic stimulation?","o":["Stimulating the vagus after low-dose nicotine","Stimulating the vagus after high-dose nicotine","Stimulating the crescentic line after low-dose nicotine","Stimulating the crescentic line after high-dose nicotine","Stimulating the crescentic line after double vagotomy"],"a":1,"ex":"After high-dose nicotine the ganglion is blocked, so impulses in the preganglionic vagus never reach the postganglionic neurons. Every route that starts at or below the crescentic line still works, and vagotomy does not matter when you stimulate the heart side."},
{"t":"q","id":"T17","src":"AC77","q":"What would be the heart-rate response to stimulating the vagus nerve at a crescentic line pre-coated with <b>atropine</b>?","o":["Decreased","Stable","Increased","Irregular","None of the above"],"a":1,"ex":"Atropine blocks M2 receptors on the nodal cells, so the ACh released by vagal fibers has nothing to act on and the rate does not change."},
{"t":"q","id":"T18","src":"AC80","q":"A patient with a decreased heart rate is given a <b>muscarinic antagonist</b>. What is the effect of this drug?","o":["Decreases afferent signals in the vagus nerve","Decreases efferent signals in the vagus nerve","Inhibits vagal tone at the SA node","Increases efferent signals in sympathetic nerves","Decreases stimulation of baroreceptors"],"a":2,"ex":"The nerve still fires; the drug blocks ACh at M2 receptors on the SA node, removing vagal tone, so HR rises."},
{"t":"q","id":"T19","src":"AC78","q":"Which of the following does <b>NOT</b> cause a depolarization block?","o":["AV nodal block","Increased extracellular K+ concentration","RMP becoming less negative","High-dose nicotine at the ganglion","Increased stimulation of nicotinic ACh receptors"],"a":0,"ex":"Depolarization block = a membrane held so depolarized that Na+ channels stay inactivated (hyperkalemia, less negative RMP, excess nicotinic agonist). AV nodal block is a failure of conduction through the node, a different idea."},
{"t":"c","id":"T-C4","title":"Heart block with Gaskell&#8217;s clamp","src":"Lab slide","html":"<figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/hb-9-9.png\" width=\"1312\" height=\"588\" alt=\"Fig 9-9: Gaskell&#8217;s clamp tightened step by step at the atrioventricular junction.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 9-9: Gaskell&#8217;s clamp tightened step by step at the atrioventricular junction. <span class=\"src\">Heart block lab manual, Fig 9-9</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Clamp at the AV junction</th><th>Atria</th><th>Ventricle</th><th>A : V</th></tr></thead><tbody><tr><td>Before</td><td class=\"num\">60</td><td class=\"num\">60</td><td class=\"num\">1:1</td></tr><tr><td>Light</td><td class=\"num\">60</td><td>{{&#8595;}}</td><td class=\"num\">{{&gt; 1:1}}</td></tr><tr><td>Moderate</td><td class=\"num\">60</td><td>{{&#8595;&#8595;}}</td><td class=\"num\">&gt; 1:1</td></tr><tr><td>Tight</td><td class=\"num\">60</td><td class=\"num\">{{0}}</td><td>&#8212;</td></tr></tbody></table></div><div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/slide-block.png\" width=\"1281\" height=\"730\" alt=\"Levels of heart block; the clamp makes an AV block.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Levels of heart block; the clamp makes an AV block. <span class=\"src\">Heart contraction &amp; vagus lab slides, p.31</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Human AV block</th><th>Picture</th></tr></thead><tbody><tr><td>1st degree: every impulse conducts, slowly</td><td>PR {{&gt; 0.20 s}}, A:V 1:1</td></tr><tr><td>2nd degree: some impulses fail</td><td>Dropped QRS (2:1, 3:1). Mobitz I: PR {{lengthens, then a beat drops}}. Mobitz II: sudden drops</td></tr><tr><td>3rd degree (complete): none conduct</td><td>{{AV dissociation}}: atria at sinus rate, ventricles at escape rate (junctional 40&#8211;60 narrow QRS; ventricular 20&#8211;40 wide QRS); syncope</td></tr></tbody></table></div></div><p class=\"note\">Conduction block also occurs in healthy people: high {{vagal tone}} (athletes, sleep) and drugs such as &#946;-blockers, calcium-channel blockers and digoxin. Levels of block: SA exit, intra-atrial, AV, bundle branch, intraventricular.</p>"},
{"t":"q","id":"T20","src":"AC75","core":true,"q":"An 80-year-old woman has syncope. The 12-lead ECG shows an atrial rate of 70 bpm and a ventricular rate of 40 bpm with no association between sinus P waves and QRS complexes. Which conduction abnormality is most likely?","o":["1st-degree AV block","2nd-degree AV block","3rd-degree AV block","SA exit block","Right bundle branch block"],"a":2,"ex":"P waves and QRS complexes march independently (AV dissociation): no atrial impulse reaches the ventricles, which follow their own escape pacemaker at 40/min."},
{"t":"tf","id":"T21","src":"Lab quiz","q":"In humans, a heart rate of 30&#8211;40 beats per minute can be caused by complete heart block.","a":true,"ex":"With complete block the ventricles rely on an escape pacemaker in the His bundle or Purkinje fibers, often 30&#8211;40/min."},
{"t":"tf","id":"T22","src":"Lab quiz","q":"In patients with complete heart block, the atria and ventricles beat at the same rate.","a":false,"ex":"They beat independently at different rates (AV dissociation)."},
{"t":"tf","id":"T23","src":"Lab quiz","q":"Conduction block can occur in normal individuals.","a":true,"ex":"Examples: high vagal tone during sleep or in athletes, and drugs that slow AV conduction."}
]});
