{"t":"c","id":"P-C1","title":"What each step of the exam can and cannot tell you","html":"<figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/pe-palpation.png\" width=\"1000\" height=\"331\" alt=\"Fig 1: palpating the apex and the base of the heart.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 1: palpating the apex and the base of the heart. <span class=\"src\">PE lab manual, Fig 1</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Step</th><th>Look for</th><th>Exam traps</th></tr></thead><tbody><tr><td><b>Inspection</b></td><td>Cyanosis, edema, breathlessness, JVP, visible apex</td><td>Cyanosis and edema may <b>not</b> be cardiac: {{lung disease, nephrotic syndrome, liver disease}}, venous or lymphatic obstruction</td></tr><tr><td><b>Palpation</b></td><td>Apex beat (PMI): left <b>{{5th ICS, midclavicular line}}</b>. Displaced = {{LV dilation}}; sustained heave = {{LV hypertrophy}}; parasternal heave = {{RV hypertrophy}}; thrills</td><td>Palpation detects {{ventricular}}, not atrial, enlargement. The PMI is at the MCL, not the mid-axillary line</td></tr><tr><td><b>Percussion</b></td><td>Area of cardiac dullness</td><td>{{Of little value}}; it cannot diagnose constrictive pericarditis</td></tr><tr><td><b>Auscultation</b></td><td>Diaphragm: <b>{{high}}</b>-pitched (S1, S2, AR, MR, rubs). Bell, held lightly: <b>{{low}}</b>-pitched (S3, S4, MS rumble)</td><td>A murmur is not always disease (innocent flow murmurs)</td></tr></tbody></table></div><p class=\"note\">Heart-failure signs by side: <b>left</b> (backward into the lungs) = {{dyspnea, orthopnea, PND, crackles}}. <b>Right</b> (backward into systemic veins) = {{raised JVP, hepatojugular reflux, hepatomegaly, ankle and sacral edema}}.</p>"},
{"t":"q","id":"P1","src":"AC79","core":true,"q":"ข้อไหนถูกต้องเกี่ยวกับการตรวจหัวใจ <span class=\"muted\">(Which is correct about heart examination?)</span>","o":["Palpation can detect atrial hypertrophy","Percussion can detect constrictive pericarditis","The diaphragm is used for high-pitched sounds","Cyanosis and edema mean heart failure"],"a":2,"ex":"Diaphragm = high pitch; bell = low pitch. Palpation finds ventricular (not atrial) enlargement, percussion cannot diagnose constrictive pericarditis, and cyanosis or edema have many non-cardiac causes."},
{"t":"q","id":"P2","src":"AC76","q":"Which is correct about heart examination?","o":["Palpation can be used to diagnose atrial hypertrophy","Percussion can be used to diagnose constrictive pericarditis","Edema and cyanosis might not be the direct effect of heart disorders","The bell of the stethoscope is used for high-pitched sounds"],"a":2,"ex":"Edema and cyanosis can come from the lungs, kidneys, liver, veins or lymphatics. The bell is for low-pitched sounds."},
{"t":"q","id":"P3","src":"AC77","flag":"A and C are both true as recalled; the real exam probably worded one of them differently.","q":"Which is correct about heart examination?","o":["Palpation can detect right ventricular hypertrophy","Percussion can detect constrictive pericarditis","The diaphragm of the stethoscope is used for high-pitched sounds","Cyanosis always indicates heart disease","The PMI is at the 5th ICS and mid-axillary line"],"a":[0,2],"ex":"A parasternal heave (felt with the heel of the hand at the left sternal edge) means RVH, and the diaphragm picks up high-pitched sounds. The PMI lies at the 5th ICS, midclavicular line."},
{"t":"q","id":"P4","src":"AC75&#8211;79","q":"Which of the following is true regarding the physical examination of the heart?","o":["Cyanosis and edema may not be the result of heart failure","A heart murmur always indicates severe valvular disease","Jugular venous distension is a sign of left-sided heart failure","Hepatojugular reflux is a sign of decreased cardiac output","Orthopnea is a sign of right-sided heart failure"],"a":0,"ex":"B: innocent murmurs exist. C: JVD reflects raised right-sided (RA) pressure. D: hepatojugular reflux shows that the right heart cannot take extra volume (raised RA pressure). E: orthopnea is pulmonary congestion, a left-sided sign."},
{"t":"q","id":"P5","src":"AC80","core":true,"q":"A medical student examines her father, who has essential hypertension. His PMI is 1 cm lateral to the midclavicular line in the 5th ICS. What is the pathophysiology of hypertension here?","o":["Atrial fibrillation","Increased afterload","Increased preload","Increased cardiac output","Increased stroke volume"],"a":1,"ex":"High arterial pressure is a pressure load (afterload) on the LV. The LV hypertrophies and later enlarges, moving the apex beat outward."},
{"t":"c","id":"P-C2","title":"Heart sounds on the cardiac cycle","html":"<div class=\"cycle\"><div class=\"ph\">Atrial systole<span>{{S4}} if the LV is stiff &#183; JVP <b>{{a}}</b></span></div><div class=\"sd\">S1</div><div class=\"ph\">Isovolumetric contraction<span>all valves shut &#183; JVP <b>{{c}}</b></span></div><div class=\"ph\">Ejection, rapid &#8594; reduced<span>carotid pulse &#183; systolic murmurs &#183; JVP <b>{{x}}</b></span></div><div class=\"sd\">S2</div><div class=\"ph\">Isovolumetric relaxation<span>all valves shut &#183; JVP <b>{{v}}</b> peak</span></div><div class=\"ph\">Rapid filling<span>{{S3}} &#183; JVP <b>{{y}}</b></span></div><div class=\"ph\">Diastasis<span>slow filling</span></div></div><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Sound</th><th>Cause</th><th>Timing</th><th>Clinical point</th></tr></thead><tbody><tr><td><b>S1</b></td><td>{{Mitral + tricuspid close}}</td><td>Between atrial systole and isovolumetric contraction</td><td>Just before the carotid upstroke; the radial pulse is later. Loud in MS</td></tr><tr><td><b>S2</b></td><td>{{Aortic + pulmonic close}}</td><td>Between ejection and isovolumetric relaxation</td><td>Splits on inspiration (P2 later). Wide fixed split = {{ASD}}</td></tr><tr><td><b>S3</b></td><td>{{Rapid ventricular filling}}</td><td>Early diastole, just after S2</td><td>Normal in the young and in pregnancy; heart failure or volume overload in adults</td></tr><tr><td><b>S4</b></td><td>{{Atrium contracting into a stiff ventricle}}</td><td>Late diastole, just before S1</td><td>LVH, hypertension, ischemia; absent in {{AF}}</td></tr></tbody></table></div>"},
{"t":"q","id":"P6","src":"AC75","core":true,"flag":"Only two options were recalled.","q":"Regarding the first heart sound (S1), which of the following events occurs?","o":["S1 occurs simultaneously with the radial pulse","S1 occurs when the mitral and tricuspid valves close"],"a":1,"ex":"S1 is AV-valve closure. The radial pulse arrives noticeably after S1, because the pulse wave takes time to reach the wrist."},
{"t":"q","id":"P7","src":"AC76","core":true,"q":"Which phase occurs just after the <b>first</b> heart sound?","o":["Ventricular ejection","Isovolumic relaxation","Isovolumic contraction","Atrial systole","Late diastole"],"a":2,"ex":"After the AV valves close, pressure builds with every valve shut until the semilunar valves open."},
{"t":"q","id":"P8","src":"AC76","core":true,"q":"Which phase occurs just after the <b>second</b> heart sound?","o":["Late diastole","Atrial systole","Isovolumetric contraction","Isovolumetric relaxation","Ventricular ejection"],"a":3,"ex":"After the semilunar valves close, ventricular pressure falls with every valve shut until the AV valves open."},
{"t":"q","id":"P9","src":"AC77","q":"Which of the following occurs right before the second heart sound?","o":["Atrial contraction","Ventricular contraction","Ventricular ejection","Ventricular filling","Isovolumic relaxation"],"a":2,"ex":"S2 marks the end of ejection (reduced ejection phase). Isovolumic relaxation comes after it."},
{"t":"q","id":"P10","src":"AC79","q":"S1 signifies closure of the AV valves. This event occurs at the transition between which two phases of the cardiac cycle?","o":["Isovolumetric contraction and rapid ejection","Atrial systole and isovolumetric contraction","Rapid ejection and reduced ejection","Isovolumetric relaxation and rapid ventricular filling","Rapid ventricular filling and atrial systole"],"a":1,"ex":"Atrial systole finishes ventricular filling, the ventricle starts to contract, the AV valves shut (S1) and isovolumetric contraction begins."},
{"t":"q","id":"P11","src":"AC80","flag":"Recall uncertain. If the stem meant an extra sound before S1 (S4), its cause would be atrial contraction, which is not offered.","q":"An abnormal heart sound (unlikely a murmur) is heard just before the carotid pulse. What might cause the sound?","o":["Rapid ventricular filling","Ventricular ejection","Atrioventricular valves open","Atrioventricular valves close","Semilunar valves close"],"a":3,"ex":"The carotid upstroke comes a moment after S1, so the sound just before it is S1 (AV-valve closure), which is abnormally loud in mitral stenosis. Rapid filling (S3) and semilunar closure (S2) come after the pulse."},
{"t":"c","id":"P-C3","title":"Where to listen and what the murmur looks like","html":"<div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/pe-areas.png\" width=\"1240\" height=\"551\" alt=\"Classic auscultation areas: P pulmonary, A aortic, M mitral, T tricuspid.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Classic auscultation areas: P pulmonary, A aortic, M mitral, T tricuspid. <span class=\"src\">PE lab manual</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Area</th><th>Site</th><th>Typical murmurs</th></tr></thead><tbody><tr><td><b>A</b> aortic</td><td>{{Right 2nd ICS}}, parasternal</td><td>AS (ejection systolic, to the carotids); AR</td></tr><tr><td><b>P</b> pulmonic</td><td>{{Left 2nd ICS}}, parasternal</td><td>PS (ejection systolic); PR (early diastolic)</td></tr><tr><td><b>E</b> Erb&#8217;s point</td><td>{{Left 3rd ICS}}</td><td>AR is often loudest here</td></tr><tr><td><b>T</b> tricuspid</td><td>{{Left lower sternal border}}, 4th&#8211;5th ICS</td><td>TR (pansystolic, louder on inspiration); TS (diastolic); VSD</td></tr><tr><td><b>M</b> mitral (apex, PMI)</td><td>{{Left 5th ICS, midclavicular line}}</td><td>MR (pansystolic, to the axilla); MS (mid-diastolic rumble, bell, left lateral position)</td></tr></tbody></table></div></div><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Lesion</th><th>Timing and shape</th><th>Where, and what makes it louder</th></tr></thead><tbody><tr><td><b>AS</b> / PS</td><td>{{Ejection systolic}}: crescendo&#8211;decrescendo, starts after S1</td><td>Aortic area, radiates to the {{carotids}} (PS: pulmonic area)</td></tr><tr><td><b>MR</b> / TR</td><td>{{Pansystolic}}: flat, S1 to S2</td><td>Apex, radiates to the {{axilla}} (TR: lower left sternal border, louder on {{inspiration}})</td></tr><tr><td><b>AR</b> / PR</td><td>{{Early diastolic}}: decrescendo, blowing, starts at S2</td><td>Erb&#8217;s point or right 2nd ICS, patient sitting forward, breath held out</td></tr><tr><td><b>MS</b></td><td>{{Mid-diastolic rumble}} after an opening snap</td><td>Apex with the {{bell}}, left lateral position</td></tr></tbody></table></div><p class=\"note\">Two questions solve most murmur items: <b>when</b> is it (with the carotid pulse = {{systolic}}; after S2 = {{diastolic}}) and <b>where</b> is it loudest (the area names the valve). The exam uses the classic areas strictly: left 2nd ICS = {{pulmonic}}.</p>"},
{"t":"q","id":"P12","src":"AC81","core":true,"q":"A patient has fatigue on exertion. A <b>diastolic</b> murmur is heard best at the <b>left 2nd ICS</b> beside the sternum. What is the most likely diagnosis?","o":["Aortic stenosis","Mitral stenosis","Aortic regurgitation","Mitral regurgitation","Pulmonary regurgitation"],"a":4,"ex":"Diastolic + pulmonic area = pulmonary regurgitation (early diastolic, decrescendo). AR is classically at the right 2nd ICS or Erb&#8217;s point."},
{"t":"q","id":"P13","src":"AC75","q":"On examination, a diastolic blowing murmur is clearest at the left second intercostal space of the sternum. What is it?","o":["Aortic stenosis","Aortic regurgitation","Pulmonary stenosis","Pulmonary regurgitation","Tricuspid stenosis"],"a":3,"ex":"Same reasoning as P12: diastolic blowing murmur at the pulmonic area."},
{"t":"q","id":"P14","src":"AC77","core":true,"q":"ตรวจพบ systolic ejection murmur ที่ left sternal border of 2nd ICS <span class=\"muted\">(Systolic ejection murmur at the left sternal border, 2nd ICS.)</span>","o":["Aortic regurgitation","Aortic stenosis","Pulmonary regurgitation","Pulmonary stenosis","Mitral regurgitation"],"a":3,"ex":"Systolic ejection + pulmonic area = pulmonary stenosis. AS would be loudest at the right 2nd ICS and radiate to the carotids."},
{"t":"q","id":"P15","src":"AC81","q":"A patient has chest discomfort. A murmur is heard at the <b>left 2nd ICS</b>, simultaneous with the carotid pulse. Most likely diagnosis?","o":["Pulmonary stenosis","Pulmonary regurgitation","Mitral stenosis","Mitral regurgitation","Aortic stenosis"],"a":0,"ex":"With the carotid pulse = systolic. Left 2nd ICS = pulmonic area. So pulmonary stenosis."},
{"t":"q","id":"P16","src":"AC76","core":true,"q":"Which condition causes a diastolic rumbling murmur at the PMI?","o":["Mitral regurgitation","Mitral stenosis","Tricuspid regurgitation","Aortic regurgitation","Coarctation of aorta"],"a":1,"ex":"Blood forced through a narrow mitral valve during diastole gives a low-pitched rumble at the apex (bell, left lateral position), often after an opening snap."},
{"t":"q","id":"P17","src":"AC78","core":true,"q":"A patient presents with a pansystolic murmur heard at the point of maximal impulse. Most likely diagnosis?","o":["Aortic stenosis","Pulmonary regurgitation","Tricuspid regurgitation","Tricuspid stenosis","Mitral regurgitation"],"a":4,"ex":"Pansystolic + apex = mitral regurgitation, radiating to the axilla."},
{"t":"q","id":"P18","src":"AC80","core":true,"q":"A patient has fatigue and chest discomfort. A diastolic murmur is best heard at the <b>left 5th ICS, parasternal border</b>. Most likely diagnosis?","o":["Tricuspid stenosis","Mitral regurgitation","Pulmonic stenosis","Aortic regurgitation","Tricuspid regurgitation"],"a":0,"ex":"Left lower sternal border = tricuspid area; diastolic = stenosis of an AV valve. So tricuspid stenosis."},
{"t":"q","id":"P19","src":"AC77","flag":"Ambiguous recall. If the stem said left upper (2nd ICS) parasternal, the answer would be pulmonary stenosis (D).","q":"Physical examination reveals a systolic murmur at the left parasternal border. Which pathology fits this finding?","o":["Mitral valve regurgitation","Mitral valve stenosis","Tricuspid valve regurgitation","Pulmonary valve stenosis","Aortic valve stenosis"],"a":2,"ex":"Without an ICS given, the left (lower) sternal border is the tricuspid area, and a systolic murmur there is tricuspid regurgitation (pansystolic, louder on inspiration)."},
{"t":"c","id":"P-C4","title":"Feeling the pulse","html":"<div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/pe-carotid.jpg\" width=\"1480\" height=\"848\" alt=\"Fig 2: palpating the carotid artery (Bates&#8217; Guide to Physical Examination, 13th ed., as cited in the manual).\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 2: palpating the carotid artery (Bates&#8217; Guide to Physical Examination, 13th ed., as cited in the manual). <span class=\"src\">PE lab manual, Fig 2</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Pulse</th><th>What you feel</th><th>Cause</th></tr></thead><tbody><tr><td><b>Collapsing</b> (water-hammer)</td><td>Sharp rise, sudden fall; wide pulse pressure, low DBP</td><td>{{Aortic regurgitation}}</td></tr><tr><td><b>Pulsus parvus et tardus</b></td><td>Small, late-peaking, delayed carotid pulse; narrow pulse pressure</td><td>{{Aortic stenosis}}</td></tr><tr><td><b>Pulsus paradoxus</b></td><td>SBP falls more than {{10 mmHg}} on inspiration</td><td>{{Cardiac tamponade}} (also severe asthma, constriction)</td></tr><tr><td><b>Pulse deficit</b></td><td>Apical rate higher than radial rate</td><td>{{Atrial fibrillation}}: short beats never reach the wrist</td></tr><tr><td><b>Pulsus alternans</b></td><td>Strong and weak beats alternate</td><td>{{Severe LV failure}}</td></tr><tr><td>Stiff arteries</td><td>Fast pulse wave, high SBP, wide pulse pressure</td><td>{{Aging, atherosclerosis}}</td></tr></tbody></table></div></div><p class=\"note\">Tamponade: Beck&#8217;s triad = {{hypotension, raised JVP, muffled heart sounds}}, plus tachycardia and narrow pulse pressure.</p>"},
{"t":"q","id":"P20","src":"AC76","core":true,"q":"Which of the following can be observed in aortic regurgitation?","o":["Collapsing pulse","Plateau pulse","Pulsus paradoxus","Weak pulse","Pulse deficit"],"a":0,"ex":"A large stroke volume gives a sharp upstroke and high SBP, and the backflow into the LV makes the pressure collapse in diastole."},
{"t":"q","id":"P21","src":"AC77","flag":"Assumes the murmur is aortic (right 2nd ICS); pulmonary regurgitation has no characteristic pulse.","q":"A patient has a diastolic murmur at the 2nd intercostal space, parasternal border. What can be found?","o":["Collapsing pulse","Plateau pulse","Pulsus paradoxus","Pulsus parvus","Pulsus tardus"],"a":0,"ex":"A diastolic murmur at the aortic area is AR, which gives a collapsing pulse. Plateau, parvus and tardus belong to AS."},
{"t":"q","id":"P22","src":"AC80","core":true,"q":"A patient has aortic stenosis. Which would be found on examination?","o":["Delayed carotid pulse","Pulsus paradoxus","Collapsing pulse"],"a":0,"ex":"The LV pushes blood through a narrow valve, so the pulse rises slowly and peaks late (pulsus parvus et tardus)."},
{"t":"q","id":"P23","src":"AC78","core":true,"q":"Which of the following is a classic sign of cardiac tamponade?","o":["Pulsus paradoxus","Increased stroke volume","Left-sided heart failure","Widened pulse pressure","Bradycardia"],"a":0,"ex":"With a fixed pericardial space, the inspiratory increase in right-heart filling pushes the septum left and shrinks LV filling, so SBP falls by more than 10 mmHg on inspiration. SV falls, pulse pressure narrows, HR rises."},
{"t":"q","id":"P24","src":"AC81","q":"A patient with chest pain, dizziness and dyspnea is diagnosed with massive pericardial effusion. What pulse can be seen?","o":["Pulsus paradoxus","Collapsing pulse","Pulsus parvus et tardus","Pulse deficit","Pulsus alternans"],"a":0,"ex":"Massive effusion = tamponade physiology = pulsus paradoxus."},
{"t":"c","id":"P-C5","title":"Jugular venous pulse","html":"<div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/pe-jvp.jpg\" width=\"1560\" height=\"806\" alt=\"Measuring the JVP: vertical height of the pulsation above the sternal angle (Assavapokee &amp; Thadanipon, N Engl J Med 2020, as cited in the manual).\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Measuring the JVP: vertical height of the pulsation above the sternal angle (Assavapokee &amp; Thadanipon, N Engl J Med 2020, as cited in the manual). <span class=\"src\">PE lab manual</span></figcaption></figure><div class=\"mini\"><h4>How to look</h4><ul><li>Patient at {{45&#176;}}, head turned slightly left; watch the {{right internal jugular vein}} (straight, valveless line to the RA)</li><li>Height of the pulsation above the {{sternal angle}} (+5 cm &#8776; RA pressure). Normal &#8804; {{3&#8211;4 cm}}</li><li>Venous, not arterial: {{two peaks per beat}}, not palpable, can be occluded, falls with inspiration, rises with abdominal pressure ({{hepatojugular reflux}})</li></ul></div></div><div class=\"mini\"><h4>The waves</h4><ul><li><b>a</b> = {{RA contraction}}. Absent in {{AF}}; cannon a waves in {{AV dissociation}} (complete heart block)</li><li><b>c</b> = {{tricuspid valve bulging into the RA}} as the RV contracts</li><li><b>x</b> = {{atrial relaxation}}, tricuspid ring pulled down during ejection</li><li><b>v</b> = {{RA filling}} with the tricuspid valve shut. Giant v (cv) in {{TR}}</li><li><b>y</b> = {{tricuspid opens, RA empties into the RV}}</li></ul></div>"},
{"t":"q","id":"P25","src":"AC81","core":true,"q":"In physical examination, what is the best vein to measure jugular venous pressure?","o":["Right internal jugular vein","Left internal jugular vein","Right external jugular vein","Left external jugular vein","Superior vena cava"],"a":0,"ex":"The right IJV runs in a straight, valveless line through the SVC into the RA, so its column reflects RA pressure. External jugulars have valves and kink easily; the left side takes a longer route."},
{"t":"open","id":"P26","src":"AC81","q":"In patients with increased RA pressure, which examination can show it?","ans":"Inspect the jugular venous pressure: a raised JVP (pulsation more than 3&#8211;4 cm above the sternal angle at 45&#176;) and a positive hepatojugular reflux (sustained rise with pressure over the liver)."},
{"t":"q","id":"P27","src":"AC76","core":true,"q":"a wave ของ jugular venous pulse เกิดจากอะไร <span class=\"muted\">(The a wave of the JVP is caused by?)</span>","o":["Atrial contraction","Atrial filling","Opening of tricuspid valve","Ventricular systole","Passive emptying of the atrium"],"a":0,"ex":"The a wave is the pressure rise from RA contraction at the end of diastole."},
{"t":"q","id":"P28","src":"AC79","q":"The &#8220;A&#8221; wave of venous pulsation in the neck correlates with which event?","o":["Ventricular systole","Atrial systole","Atrial relaxation","Atrial filling","Tricuspid valve closure"],"a":1,"ex":"Atrial systole. Atrial relaxation is the x descent and atrial filling is the v wave."},
{"t":"q","id":"P29","src":"AC80","flag":"In the recalled figure the arrow lands at the foot of the wave rather than its peak. The label a and the options point to the a wave.","q":"The jugular venous pulse of a patient is shown below. What happens at point <b>a</b>?","fig":"<figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/ac80-jvp.png\" width=\"1248\" height=\"621\" alt=\"AC80 exam figure\" loading=\"lazy\" decoding=\"async\"></div><figcaption class=\"srconly\"><span class=\"src\">AC80 exam figure</span></figcaption></figure>","o":["RA contracts","RA relaxes","RA fills","RV contracts"],"a":0,"ex":"a = RA contraction; x = RA relaxation; v = RA filling; c = RV contraction pushing the tricuspid valve up."},
{"t":"q","id":"P30","src":"AC80","core":true,"q":"A patient has been diagnosed with atrial fibrillation. Which wave of the jugular venous pulse should be absent?","o":["a","c","x","v","y"],"a":0,"ex":"In AF the atria only quiver, so there is no coordinated atrial contraction and no a wave (and no S4)."},
{"t":"q","id":"P31","src":"AC81","q":"Which condition results in the absence of the &#8220;a&#8221; wave of the jugular pulse?","o":["Atrial fibrillation","Sinus tachycardia","Sinus bradycardia","Sinus arrhythmia"],"a":0,"ex":"All sinus rhythms keep atrial contraction; only AF loses it."},
{"t":"q","id":"P32","src":"AC76","core":true,"q":"A 56-year-old man with right heart failure has a pansystolic murmur that increases with inspiration, loudest at the left lower sternal border. What JVP abnormality is expected?","o":["Elevated V wave","Exaggerated X wave","Cannon A wave","Absent A wave","Elevated A wave"],"a":0,"ex":"The murmur is tricuspid regurgitation: blood jets back into the RA during ventricular systole, producing a giant v (cv) wave and filling in the x descent."},
{"t":"c","id":"P-C6","title":"Breathing, S2 splitting and the ASD","html":"<ul class=\"pts\"><li><b>Normal inspiration</b>: intrathoracic pressure falls &#8594; more venous return to the right heart &#8594; RV ejects a little longer &#8594; P2 comes {{later}} &#8594; S2 splits. {{Deep inspiration}} is the strongest quick boost to venous return.</li><li><b>ASD</b>: blood shunts LA &#8594; RA all the time, so the RV always carries extra volume and P2 is always late (<b>{{wide}}</b> split).</li><li>On inspiration the extra systemic venous return raises RA pressure, so the <b>LA &#8594; RA shunt {{shrinks}}</b>. RV volume stays about the same in both phases, so the split is <b>{{fixed}}</b>.</li><li>So the parameter that <b>decreases</b> on inspiration in ASD is the {{shunt volume}}; RA preload and venous return increase.</li></ul>"},
{"t":"q","id":"P33","src":"AC78","core":true,"q":"A 25-year-old woman has dyspnea and fatigue on exertion and a widely split S2. She is diagnosed with an atrial septal defect. What <b>decreases</b> during inspiration?","o":["RA preload","LA preload","Venous return","LA&#8211;RA shunt volume","Systemic vascular resistance"],"a":3,"ex":"Inspiration raises systemic venous return and RA pressure, which cuts the pressure gradient from LA to RA, so less blood crosses the defect."},
{"t":"q","id":"P34","src":"AC78","q":"A patient has a wide, split S2 and an ASD without other abnormality. Which parameter is decreased on inspiration compared with expiration?","o":["LV preload","RV preload","Venous return","LV ejection fraction","LA to RA shunting volume"],"a":4,"ex":"Same mechanism as P33: inspiration shrinks the left-to-right shunt."},
{"t":"q","id":"P35","src":"AC77","q":"Which mechanism is most effective at acutely and significantly increasing venous return to the right atrium in a healthy person?","o":["Deep inspiration","Arterial vasodilation","Decreased sympathetic tone","Standing upright quietly","Increased heart rate"],"a":0,"ex":"A deep breath drops intrathoracic pressure and raises abdominal pressure (thoracoabdominal pump), pulling blood into the chest. Standing still and lower sympathetic tone reduce venous return."}
]});

CVS.add({"id":"D","short":"Dog lab I","title":"Lab: Disturbance of CVS I (dog): reflexes and drugs","kind":"Lab","blurb":"Baroreceptor and chemoreceptor reflexes, nerve stimulation (vagus, aortic, sciatic, splanchnic), vagotomy, posture, CO2 and catecholamines.","items":[
{"t":"c","id":"D-C1","title":"How to reason through any dog-lab tracing","html":"<div class=\"cols2\"><div class=\"mini\"><h4>What is recorded</h4><p>In the anesthetized dog: arterial BP (cannula + transducer), heart rate, respiration and central venous pressure, sometimes ECG. Each maneuver changes these traces in a typical way.</p></div><div class=\"mini\"><h4>Four questions to ask</h4><ol class=\"steps tight\"><li>What changed first: pressure, volume, gas, or a nerve?</li><li>Which receptor senses it (carotid sinus, aortic arch, carotid/aortic bodies, atria)?</li><li>Which arm carries the answer: vagus to the heart, sympathetic to heart and vessels, adrenal catecholamines, phrenic to the diaphragm?</li><li>Has any arm been cut or blocked (vagotomy, atropine, denervated heart)? Then that part of the response disappears.</li></ol></div></div><p class=\"note\">Nerve stimulation: stimulating the <b>peripheral</b> (heart-side) cut end tests the {{efferent}} fibers; stimulating the <b>central</b> (brain-side) cut end tests the {{afferent}} fibers and the reflex they start. <b>Low current</b> excites the {{large, low-threshold fibers (baroreceptor afferents)}}; <b>high current</b> also recruits {{small, high-threshold fibers (chemoreceptor and pain afferents)}}.</p>"},
{"t":"c","id":"D-C2","title":"Dog I: expected responses","src":"Lab quiz key + physiology","html":"<div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th>Maneuver</th><th>BP</th><th>HR</th><th>RR</th><th>Why</th></tr></thead><tbody><tr><td>Compress the common carotid</td><td class=\"up\">&#8593;</td><td class=\"up\">&#8593;</td><td class=\"up\">&#8593;</td><td>{{Carotid-sinus pressure falls &#8594; baroreceptors unloaded}}</td></tr><tr><td>Pull / press the carotid sinus (carotid massage)</td><td class=\"dn\">&#8595;</td><td class=\"dn\">&#8595;</td><td class=\"dn\">&#8595;</td><td>{{Baroreceptors fire more}} &#8594; &#8593;vagal, &#8595;sympathetic, respiratory inhibition</td></tr><tr><td>Same, after double vagotomy</td><td class=\"dn\">&#8595;</td><td>no slowing</td><td class=\"dn\">&#8595;</td><td>{{The vagus (HR effector) is cut}}; sympathetic withdrawal and phrenic inhibition remain</td></tr><tr><td>Bilateral vagotomy itself</td><td>&#8212;/&#8593;</td><td class=\"up\">&#8593;</td><td>slower, deeper</td><td>Vagal tone lost; {{lung stretch afferents}} lost</td></tr><tr><td>Vagus, <b>peripheral</b> end</td><td class=\"dn\">&#8595;</td><td class=\"dn\">&#8595;&#8595; / arrest</td><td>&#8212;</td><td>{{ACh on the SA/AV node}} (vagal escape if prolonged)</td></tr><tr><td>Vagus, central end, <b>low</b> current</td><td class=\"dn\">&#8595;</td><td class=\"dn\">&#8595;</td><td class=\"dn\">&#8595;</td><td>{{Aortic baroreceptor afferents}}</td></tr><tr><td>Vagus, central end, <b>high</b> current</td><td class=\"up\">&#8593;</td><td class=\"up\">&#8593;</td><td class=\"up\">&#8593;</td><td>{{Chemoreceptor afferents (aortic bodies)}} recruited</td></tr><tr><td>Aortic (depressor) nerve: low / high current</td><td>&#8595; / &#8593;</td><td>&#8595; / &#8593;</td><td>&#8595; / &#8593;</td><td>Large baroreceptor fibers / small chemoreceptor fibers</td></tr><tr><td>Sciatic nerve, central end, <b>low</b> current</td><td class=\"dn\">&#8595;</td><td class=\"dn\">&#8595;</td><td>&#8776; (lab trace)</td><td>{{Depressor reflex}}: &#8593;vagal (muscarinic at the SA node, slower AV conduction), &#8595;sympathetic</td></tr><tr><td>Sciatic nerve, central end, <b>high</b> current</td><td class=\"up\">&#8593;</td><td class=\"up\">&#8593;</td><td class=\"up\">&#8593;</td><td>{{Pressor (pain) reflex}}: sympathetic + phrenic drive</td></tr><tr><td>CO&#8322; inhalation</td><td class=\"up\">&#8593;</td><td class=\"up\">&#8593;</td><td class=\"up\">&#8593;</td><td>Central and peripheral chemoreceptors; locally CO&#8322; {{dilates}} vessels</td></tr><tr><td>Occlude the trachea (asphyxia)</td><td class=\"up\">&#8593;</td><td>&#8593; then &#8595;</td><td>gasping</td><td>Hypoxia + hypercapnia on chemoreceptors</td></tr><tr><td>Head-down / head-up tilt</td><td>&#8593; / &#8595;, then back</td><td>&#8595; / &#8593;</td><td>&#8212;</td><td>Venous return changes first, then {{the baroreflex}} pulls BP back</td></tr></tbody></table></div>"},
{"t":"tf","id":"D1","src":"Lab quiz","q":"Baroreceptors can be found at the junction between the tunica media and tunica adventitia.","a":true,"ex":"They are spray-type nerve endings in the collagen- and elastin-rich tissue between media and adventitia, where wall stretch deforms them."},
{"t":"q","id":"D2","src":"AC78","core":true,"q":"A woman comes to the ER with a rapid heart rate. The doctor presses below the angle of the mandible. What will most likely happen?","o":["Decreased baroreceptor firing, increased HR","Decreased baroreceptor firing, decreased HR","Increased baroreceptor firing, decreased HR","Increased chemoreceptor firing, increased HR","Decreased chemoreceptor firing, decreased HR"],"a":2,"ex":"Carotid sinus massage stretches the sinus like a pressure rise: more baroreceptor firing &#8594; more vagal output &#8594; slower SA rate and AV conduction (used to stop supraventricular tachycardia)."},
{"t":"c","id":"D-C3","title":"Real tracings: carotid sinus and common carotid","src":"Dog I","html":"<div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog-carotidsinus.png\" width=\"1335\" height=\"631\" alt=\"Exp 3, panel A: pulling the carotid sinus, low then high intensity.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 3, panel A: pulling the carotid sinus, low then high intensity. <span class=\"src\">Dog I lab sheet, Exp 3A</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog-carotidsinus-b.png\" width=\"1335\" height=\"582\" alt=\"Exp 3, panel B: electrical stimulation of the carotid sinus.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 3, panel B: electrical stimulation of the carotid sinus. <span class=\"src\">Dog I lab sheet, Exp 3B</span></figcaption></figure></div><figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/dog-cca.png\" width=\"1335\" height=\"679\" alt=\"Exp 4: compressing the common carotid artery.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 4: compressing the common carotid artery. <span class=\"src\">Dog I lab sheet, Exp 4</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th>Control 160/120, HR 110, RR 14</th><th>BP</th><th>HR</th><th>RR</th><th>Why</th></tr></thead><tbody><tr><td>Pull the sinus, low &#8594; high intensity</td><td>{{&#8595; 150/110 &#8594; 140/100}}</td><td>{{&#8595; 105 &#8594; 90}}</td><td>{{&#8595; 12 &#8594; 10}}</td><td>Stretch = {{more baroreceptor firing}}; a stronger pull gives a bigger fall</td></tr><tr><td>Stimulate the sinus electrically</td><td>{{&#8595; 120/80}}</td><td>{{&#8595; 100}}</td><td>{{&#8595; 10}}</td><td>Fires the same afferents directly</td></tr><tr><td>Compress the common carotid</td><td>{{&#8593; 190/150}}</td><td>{{&#8593; 140}}</td><td>{{&#8593; 18}}</td><td>The sinus lies beyond the clamp, so its pressure {{falls}}: baroreceptors unloaded &#8594; sympathetic up, vagus down</td></tr></tbody></table></div><p class=\"note\">Breathing slows with baroreceptor stimulation in the anesthetized dog. In patients, carotid massage raises {{vagal tone}}, slowing the heart and AV conduction (used to stop some supraventricular tachycardias).</p>"},
{"t":"q","id":"D3","src":"AC77","q":"Which of the following is the result of performing carotid massage?","o":["Sends a signal to the medulla oblongata","Decreased vagal tone","Inhibition of the parasympathetic nervous system","Increased heart rate","Increased vagal tone"],"a":4,"ex":"The end result is more vagal tone (slower heart, slower AV conduction). Option A is a step on the way, not the result."},
{"t":"q","id":"D4","src":"AC77","core":true,"q":"Which of the following is <b>NOT</b> a direct response or consequence of carotid massage?","o":["Increased afferent impulses in the glossopharyngeal nerve","Stimulation of baroreceptors in the carotid sinus","Increased parasympathetic outflow to the SA and AV nodes","Decreased heart rate and AV conduction velocity","Increased peripheral vascular resistance due to sympathetic withdrawal"],"a":4,"ex":"Sympathetic withdrawal relaxes arterioles, so peripheral resistance <b>falls</b>. Everything else is the normal baroreflex chain."},
{"t":"tf","id":"D5","src":"Lab quiz","q":"Carotid sinus massage increases parasympathetic outflow to the heart, which can slow the heart rate and conduction velocity.","a":true,"ex":"Baroreceptor stimulation &#8594; NTS &#8594; vagal nuclei &#8594; slower SA node and AV node."},
{"t":"q","id":"D6","src":"AC79","core":true,"q":"A tracing shows BP <b>decreased</b> and respiratory rate <b>decreased</b>. Which maneuver caused it?","o":["Stimulating the splanchnic nerve","Pulling on the carotid sinus","Changing position from supine to upright","Clamping the ascending aorta","Occluding the trachea"],"a":1,"ex":"Stretching the carotid sinus mimics high pressure: BP and HR fall and breathing is inhibited. Splanchnic stimulation raises BP; standing lowers BP but does not slow breathing; asphyxia raises BP and breathing effort."},
{"t":"tf","id":"D7","src":"Lab quiz","core":true,"q":"When changing from an upright to a supine position, blood pressure increases and then decreases because of an increase in the stimulation of the baroreceptors.","a":true,"ex":"Lying down returns pooled blood: BP rises first, then the stronger baroreceptor firing brings it back down."},
{"t":"c","id":"D-C4","title":"Real tracings: tilting the dog","src":"Dog I","html":"<div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog-headdown.png\" width=\"1335\" height=\"806\" alt=\"Exp 1.1: head-down tilt.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 1.1: head-down tilt. <span class=\"src\">Dog I lab sheet, Exp 1.1</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog-headup.png\" width=\"1335\" height=\"703\" alt=\"Exp 1.2: head-up tilt.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 1.2: head-up tilt. <span class=\"src\">Dog I lab sheet, Exp 1.2</span></figcaption></figure></div><div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th>Control 170/120, HR 108</th><th>(A) first</th><th>(B) after the reflex</th><th>Why</th></tr></thead><tbody><tr><td>Head down</td><td>{{BP &#8593; 185/135}}</td><td>{{BP 130/90, HR &#8595; 95}}</td><td>Blood runs toward the heart: venous return {{&#8593;}} &#8594; BP up &#8594; baroreceptors fire more &#8594; BP and HR pulled down</td></tr><tr><td>Head up</td><td>{{BP &#8595; 100/60}}</td><td>{{BP 150/95, HR &#8593; 120}}</td><td>Blood pools in the lower body: venous return {{&#8595;}} &#8594; BP down &#8594; baroreceptors unloaded &#8594; HR and vascular tone up</td></tr></tbody></table></div><p class=\"note\">The breathing trace cannot be read during the tilt (&#8220;RR cannot be evaluated&#8221;). It is the same reflex as standing up in the BP lab: the {{carotid sinus}} senses the change first.</p>"},
{"t":"tf","id":"D8","src":"Lab quiz","core":true,"q":"Carotid sinus stimulation after double vagotomy does not slow the heart rate but decreases blood pressure.","a":true,"ex":"The cardioinhibitory center acts through the vagi, which are cut, so HR cannot slow. Sympathetic withdrawal still lowers BP, and breathing still slows."},
{"t":"c","id":"D-C5","title":"Real tracing: carotid sinus after double vagotomy","src":"Dog I","html":"<figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/dog-vagotomy-cs.png\" width=\"1335\" height=\"592\" alt=\"Exp 7.1: pulling, then electrically stimulating, the carotid sinus after both vagi are cut.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 7.1: pulling, then electrically stimulating, the carotid sinus after both vagi are cut. <span class=\"src\">Dog I lab sheet, Exp 7.1</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th>After double vagotomy: control 160/120, HR 110, RR 8</th><th>BP</th><th>HR</th><th>RR</th></tr></thead><tbody><tr><td>Pull the carotid sinus</td><td>{{&#8595; 120/80}}</td><td>{{110, unchanged}}</td><td>{{&#8595; 6}}</td></tr><tr><td>Stimulate it electrically</td><td>{{&#8595; 100/60}}</td><td>{{110, unchanged}}</td><td>{{&#8595; 6}}</td></tr></tbody></table></div><ul class=\"pts\"><li>The vagi carry the {{efferent}} fibers that slow the heart, so the heart rate {{no longer falls}}.</li><li>BP still falls through {{sympathetic withdrawal}} (arteriolar and venous dilation), and breathing still slows ({{phrenic}} inhibition).</li><li>Vagotomy itself: control RR is only 8 (it was 14) and the breaths are deeper, because the {{lung stretch afferents}} in the vagus are gone.</li></ul>"},
{"t":"tf","id":"D9","src":"Lab quiz","core":true,"q":"High-current electrical stimulation at the central side of the vagus nerve decreases blood pressure because the afferent fibers from the baroreceptors are mostly stimulated.","a":false,"ex":"High current recruits the small chemoreceptor fibers (aortic bodies), so the response resembles chemoreceptor stimulation: BP, HR and RR <b>rise</b>. Low current gives the baroreceptor (depressor) response."},
{"t":"tf","id":"D10","src":"Lab quiz","q":"CO2 generally causes vasoconstriction.","a":false,"ex":"Locally CO2 dilates peripheral vessels (especially in the brain); only pulmonary vessels constrict. Centrally it stimulates chemoreceptors, which raises BP, HR and RR."},
{"t":"q","id":"D11","src":"AC79","core":true,"q":"In an anesthetized dog, the sciatic nerve is cut and its <b>central</b> end is stimulated with <b>low</b> current. Increased activation occurs at which receptor?","o":["Muscarinic receptor at the SA node","Nicotinic receptor at the SA node","&#946;1 receptor at the AV node","&#946;1 receptor at ventricular cells","Nicotinic receptor at the AV node"],"a":0,"ex":"Low-current somatic afferent stimulation gives a depressor reflex: vagal output rises (ACh on M2 at the SA node) and sympathetic output falls. Nodal cells carry muscarinic, not nicotinic, receptors."},
{"t":"c","id":"D-C6","title":"Real tracing: central end of the sciatic nerve","src":"Dog I","html":"<figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/dog-sciatic.png\" width=\"1335\" height=\"621\" alt=\"Exp 5: the sciatic nerve is cut, then its central end is stimulated with low and then high current.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 5: the sciatic nerve is cut, then its central end is stimulated with low and then high current. <span class=\"src\">Dog I lab sheet, Exp 5</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th>Control 150/110, HR 100, RR 12</th><th>BP</th><th>HR</th><th>RR</th><th>Reflex</th></tr></thead><tbody><tr><td><b>Low</b> current</td><td>{{&#8595; 130/90}}</td><td>{{&#8595; 96}}</td><td>{{12, about the same}}</td><td>{{Depressor}}: &#8593;vagal (M2 at the SA node, slower AV conduction), &#8595;sympathetic</td></tr><tr><td><b>High</b> current</td><td>{{&#8593; 200/170}}</td><td>{{&#8593; 120}}</td><td>{{&#8593; 56}}</td><td>{{Pressor (pain)}}: sympathetic drive, plus phrenic ACh at the diaphragm for the fast breathing</td></tr></tbody></table></div><p class=\"note\">Low current excites the large, low-threshold afferents; high current recruits the small pain fibers as well. Exam keys write low current as &#8220;BP, HR and RR all decreased&#8221;, but in this recording the breathing hardly changed.</p>"},
{"t":"q","id":"D12","src":"AC81","core":true,"q":"Low-current stimulation of the central cut end of the sciatic nerve changes blood pressure, heart rate and respiratory rate in what way, respectively?","o":["Increased, increased, decreased","Increased, decreased, increased","Decreased, decreased, decreased","Decreased, increased, unchanged","Decreased, increased, decreased"],"a":2,"ex":"Low current = depressor reflex: BP and HR fall (more vagal, less sympathetic output). High current = pressor (pain) reflex: BP, HR and RR all rise.","flag":"The AC81 stem names only BP and HR, yet each option has three values. In the Dog I tracing (D-C6) low current lowered BP and HR while RR stayed about the same. C is the only option with BP and HR both decreased, and it matches the AC81 key."},
{"t":"q","id":"D13","src":"AC80","q":"Low-current stimulation of the central cut end of the sciatic nerve elicits what response?","o":["Decreased stimulation of chemoreceptors","Decreased stimulation of baroreceptors","Delay of AV conduction time","Increased conduction velocity"],"a":2,"ex":"The depressor reflex raises vagal output, which slows the AV node (longer AV conduction time)."},
{"t":"q","id":"D14","src":"AC78","core":true,"q":"High-current stimulation at the central cut end of the sciatic nerve raises heart rate, blood pressure and respiratory rate. What is the most likely cause of these responses?","o":["Increased epinephrine binding at &#946;2 receptors","Increased afferent firing at carotid baroreceptors","Increased norepinephrine secretion at sympathetic ganglia","Increased firing of central chemoreceptors due to low PO2","Increased acetylcholine secretion at the terminal end of the phrenic nerve"],"a":4,"ex":"Read each option for its error. &#946;2 binding dilates vessels. More baroreceptor firing would lower BP and HR. Sympathetic <b>ganglia</b> use ACh on nicotinic receptors; NE is released at the postganglionic endings, so C is a trap. Central chemoreceptors sense CO2/H+, not O2. Phrenic motor endings release ACh at the diaphragm, which explains the faster breathing."},
{"t":"tf","id":"D15","src":"Lab quiz","core":true,"q":"After the end of splanchnic nerve stimulation, blood pressure is lower than baseline due to the effect of &#946;1 stimulation at blood vessels.","a":false,"ex":"The dip is from &#946;2 vasodilation: as adrenal epinephrine falls to a low concentration, its &#946;2 action outweighs its &#945; action."},
{"t":"c","id":"D-C7","title":"Splanchnic nerve and drugs","src":"Lab quiz key + pharmacology","html":"<div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog-splanchnic.png\" width=\"1335\" height=\"699\" alt=\"Exp 2: splanchnic nerve stimulation, low then high current.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 2: splanchnic nerve stimulation, low then high current. <span class=\"src\">Dog I lab sheet, Exp 2</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog-vagotomy-spl.png\" width=\"1335\" height=\"689\" alt=\"Exp 7.2: splanchnic stimulation after double vagotomy.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 7.2: splanchnic stimulation after double vagotomy. <span class=\"src\">Dog I lab sheet, Exp 7.2</span></figcaption></figure></div><ul class=\"pts\"><li>Control 150/110, HR 104, RR 12 &#8594; BP {{&#8593; 180/150}}, then {{&#8593; 220/160}} at high current; HR 112 &#8594; {{80}} as the baroreflex answers; RR {{&#8595; 6 &#8594; 4}}.</li><li>Two pressor parts: {{&#945;1 constriction}} of the splanchnic vessels, then {{adrenal epinephrine}} (a second, slower rise).</li><li>When stimulation stops, BP dips <b>{{below baseline}}</b>: the leftover low epinephrine level acts on {{&#946;2}} (vasodilation).</li><li>After double vagotomy: BP 200/150 with HR {{&#8593; 120}}. There is no reflex bradycardia, and {{slower breathing}} is the only visible baroreflex effect.</li></ul><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Drug</th><th>Main receptors</th><th>BP</th><th>HR</th><th>Notes</th></tr></thead><tbody><tr><td><b>Epinephrine, low dose</b></td><td>{{&#946;2 &gt; &#945;}}; &#946;1</td><td class=\"dn\">&#8595;DBP, MAP &#8595;</td><td class=\"up\">&#8593;</td><td>Muscle, liver, coronary vessels dilate; CVP falls as the heart pumps harder</td></tr><tr><td><b>Epinephrine, high dose</b></td><td>{{&#945;1 + &#946;1}}</td><td class=\"up\">&#8593;&#8593;</td><td>&#8593; then reflex &#8595;</td><td>Reflex &#8595;RR ({{adrenaline apnea}}); renal vasoconstriction &#8595;urine</td></tr><tr><td>Norepinephrine</td><td>&#945;1, &#946;1</td><td class=\"up\">&#8593;&#8593;</td><td class=\"dn\">{{reflex &#8595;}}</td><td>Little &#946;2 effect</td></tr><tr><td>Phenylephrine</td><td>&#945;1</td><td class=\"up\">&#8593;</td><td class=\"dn\">{{reflex &#8595;}}</td><td>Raises afterload without direct inotropy</td></tr><tr><td>Isoproterenol</td><td>&#946;1, &#946;2</td><td class=\"dn\">{{&#8595;}}</td><td class=\"up\">&#8593;&#8593;</td><td>Pure &#946;</td></tr><tr><td>Acetylcholine</td><td>M (vessels via NO; M2 on heart)</td><td class=\"dn\">&#8595;</td><td class=\"dn\">&#8595;</td><td>Blocked by {{atropine}}</td></tr><tr><td>Nitroglycerin</td><td>NO donor, mainly {{veins}}</td><td class=\"dn\">&#8595;</td><td class=\"up\">reflex &#8593;</td><td>&#8595;venous return, &#8595;preload, &#8595;CVP</td></tr></tbody></table></div><p class=\"note\">After vagotomy there is no reflex bradycardia: drugs that raise BP now also raise HR. A denervated heart still responds to {{circulating catecholamines}}.</p>"},
{"t":"tf","id":"D16","src":"Lab quiz","core":true,"q":"In splanchnic nerve stimulation after double vagotomy, decreased respiratory rate is the only visible effect of increased baroreceptor stimulation.","a":true,"ex":"BP stays up (circulating catecholamines) and HR cannot slow (vagi cut), so the only sign that the baroreflex fired is slower breathing."},
{"t":"tf","id":"D17","src":"Lab quiz","q":"Low-dose epinephrine causes vasodilation.","a":true,"ex":"At low concentration epinephrine acts mostly on &#946;2 receptors in skeletal muscle, liver and coronary vessels, lowering TPR and DBP."},
{"t":"q","id":"D18","src":"AC78","core":true,"q":"A substance causes a drop in both central venous pressure and blood pressure, while heart rate increases significantly. Which substance is most likely?","o":["Dopamine","Low-dose epinephrine","Norepinephrine","Phenylephrine","High-dose epinephrine"],"a":1,"ex":"&#946;2 vasodilation lowers TPR and BP; &#946;1 raises HR and contractility, so the heart empties the veins and CVP falls. Norepinephrine, phenylephrine and high-dose epinephrine all raise BP."},
{"t":"q","id":"D19","src":"AC79","q":"Which of the following mechanisms results in an increased heart rate?","o":["Increased stimulation of baroreceptors","Increased efferent signals of the glossopharyngeal nerve","Increased afferent signals of the aortic nerve","Increased epinephrine release from the adrenal medulla","Increased acetylcholine release from the vagus nerve"],"a":3,"ex":"Circulating epinephrine acts on &#946;1 at the SA node. More baroreceptor or aortic-nerve input and more vagal ACh all slow the heart; CN IX carries afferents from the sinus."},
{"t":"q","id":"D20","src":"AC77","flag":"Options b and c were recalled as &#8220;fluctuate&#8221;; BP does rise and then dip below baseline.","q":"Which of the following will occur after injection of <b>high-dose adrenaline</b>?","o":["Decreased respiratory rate","Fluctuating blood pressure","Fluctuating heart rate","Increased central venous pressure","Decreased urine flow"],"a":0,"ex":"The large pressure rise drives the baroreflex, which inhibits breathing (adrenaline apnea) and slows the heart. Urine flow falls too, but it is not recorded in this lab."},
{"t":"q","id":"D21","src":"AC77","q":"If adrenaline is injected intravenously after the dog has had a vagotomy, which will occur?","o":["Fluctuating blood pressure","Fluctuating heart rate","Decreased respiratory rate"],"a":2,"ex":"Without the vagi, the rise in BP can no longer slow the heart, so HR simply rises. Carotid-sinus afferents (CN IX) still inhibit breathing, so RR falls."},
{"t":"tf","id":"D22","src":"Lab quiz","q":"In a denervated heart, increased sympathetic stimulation does not increase its inotropic effect.","a":true,"ex":"A transplanted heart has no sympathetic nerves, so nerve stimulation cannot reach it. It still responds to circulating catecholamines from the adrenal medulla."}
]});
CVS.add({"id":"H","short":"Dog lab II","title":"Lab: Disturbance of CVS II (dog): hemodynamic disturbances","kind":"Lab","blurb":"IV fluid, hemorrhage, caval occlusion, nitroglycerin, tamponade, aortic regurgitation, coarctation and arrhythmias.","items":[
{"t":"c","id":"H-C1","title":"Dog II: what each disturbance does","html":"<div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th>Disturbance</th><th>CVP</th><th>BP</th><th>HR</th><th>Key idea</th></tr></thead><tbody><tr><td>IV saline into a vein / RA</td><td class=\"up\">&#8593;</td><td class=\"up\">&#8593;</td><td>&#8593; or &#8595;</td><td>&#8593;venous return &#8594; &#8593;preload &#8594; &#8593;SV, &#8593;CO ({{Frank&#8211;Starling}}). HR may rise ({{atrial stretch, Bainbridge}}) or fall ({{baroreflex}})</td></tr><tr><td>Hemorrhage</td><td class=\"dn\">&#8595;</td><td class=\"dn\">&#8595;</td><td class=\"up\">&#8593;</td><td>Baroreceptor and chemoreceptor reflexes; RR &#8593;. Within 15&#8211;30 min interstitial fluid moves into vessels, so {{Hct falls}}</td></tr><tr><td>Clamp SVC (or IVC)</td><td class=\"dn\">&#8595; (RA)</td><td class=\"dn\">&#8595;</td><td class=\"up\">&#8593;</td><td>&#8595;venous return; reflex &#8593;contractility and &#8593;TPR. Pressure in the veins {{upstream}} (head, arms) rises</td></tr><tr><td>Nitroglycerin</td><td class=\"dn\">&#8595;</td><td class=\"dn\">&#8595;</td><td class=\"up\">reflex &#8593;</td><td>Venodilation &#8594; blood pools in veins &#8594; {{&#8595;preload}}</td></tr><tr><td>Fluid into the pericardial sac</td><td class=\"up\">&#8593;</td><td class=\"dn\">&#8595;</td><td class=\"up\">&#8593;</td><td>Tamponade: the heart cannot fill, so {{CVP rises while venous return falls}}; narrow pulse pressure; pulsus paradoxus</td></tr><tr><td>Aortic valve destroyed (AR)</td><td>&#8212;</td><td>SBP &#8593;, DBP &#8595;</td><td>&#8212;/&#8593;</td><td>Backflow in diastole: &#8593;EDV, &#8593;total SV, {{wide pulse pressure, collapsing pulse}}</td></tr><tr><td>Aortic stenosis / clamp the aorta</td><td>may &#8593;</td><td>&#8593; proximal, &#8595; distal</td><td>&#8212;</td><td>&#8593;LV pressure and afterload; {{pressure backs up}}</td></tr><tr><td>Coarctation (distal to left subclavian)</td><td>&#8212;</td><td>&#8593; arms, &#8595; legs</td><td>&#8212;</td><td>&#8593;LV afterload; {{weak, delayed femoral pulse}}</td></tr></tbody></table></div><p class=\"note\">A high CVP does not always mean {{a full circulation}}: tamponade raises CVP while the heart is starved of filling.</p>"},
{"t":"q","id":"H1","src":"AC77","core":true,"q":"What is the <b>direct</b> effect of injecting IV fluid into the right atrium?","o":["Increased cardiac output","Decreased afterload","Increased afterload","Increased heart rate","Decreased heart rate"],"a":0,"ex":"More volume in the RA raises preload, so stroke volume and cardiac output rise (Frank&#8211;Starling). Any HR change is a secondary reflex."},
{"t":"q","id":"H2","src":"AC75","q":"ฉีด IV fluid เข้า right atrium กับ pulmonary artery อะไรคือ cardiovascular response? <span class=\"muted\">(IV fluid into the RA and pulmonary artery: CV response?)</span>","o":["Decreased arterial pressure","Salt and water retention","Decreased intrathoracic pressure","Increased venous sympathetic tone","Increased cardiac output"],"a":4,"ex":"Volume loading raises preload and CO. The body then <b>excretes</b> salt and water (ANP, less ADH) and lowers sympathetic tone."},
{"t":"tf","id":"H3","src":"Lab quiz","core":true,"q":"An elevated CVP means that there is a large amount of intravascular volume.","a":false,"ex":"CVP also rises when the right heart cannot accept blood (tamponade, right heart failure, tricuspid or pulmonary disease) even with normal or low volume."},
{"t":"q","id":"H4","src":"AC79","core":true,"q":"After a significant venous hemorrhage in the lab dog, with compensatory mechanisms working normally, what is the expected change in vital signs?","o":["&#8595;HR, &#8595;RR, &#8593;BP","&#8593;HR, &#8595;RR, &#8593;BP","&#8593;HR, &#8593;RR, &#8595;BP","&#8595;HR, &#8593;RR, &#8595;BP","No significant change"],"a":2,"ex":"Blood loss lowers BP. Baroreceptor unloading raises HR; low flow to the carotid bodies (and acidosis) raises breathing. Compensation limits the fall but BP stays below baseline."},
{"t":"q","id":"H5","src":"AC79","core":true,"q":"Hemorrhage: Hct is 42% at 5 min and 40% at 15 min. Explain the mechanism.","o":["Intracellular fluid shifts to the extracellular fluid","Aldosterone is induced","Interstitial fluid shifts into the intravascular space","More erythrocytes are lost than plasma"],"a":2,"ex":"Lower arterial and venous pressure lowers capillary hydrostatic pressure, so Starling forces favor reabsorption. Cell-free interstitial fluid enters the plasma and dilutes the red cells. Aldosterone works over hours."},
{"t":"q","id":"H6","src":"AC80","core":true,"q":"A patient has occlusion of the superior vena cava. What happens to venous return, contractility and total systemic resistance compared with baseline?","o":["Decreased, decreased, unchanged","Decreased, increased, unchanged","Decreased, increased, increased","Decreased, decreased, increased","Increased, decreased, decreased"],"a":2,"ex":"Less venous return &#8594; lower SV and BP &#8594; baroreflex raises sympathetic output: contractility up and TPR up."},
{"t":"c","id":"H-C2","title":"Real tracings: clamping the venae cavae","src":"Dog II","html":"<div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog2-svc.png\" width=\"1335\" height=\"543\" alt=\"Exp 2, panel A: superior vena cava occlusion.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 2, panel A: superior vena cava occlusion. <span class=\"src\">Dog II lab sheet, Exp 2A</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog2-ivc.png\" width=\"1335\" height=\"543\" alt=\"Exp 2, panel B: inferior vena cava occlusion.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 2, panel B: inferior vena cava occlusion. <span class=\"src\">Dog II lab sheet, Exp 2B</span></figcaption></figure></div><div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th>Control 100/50 (PP 50), HR 88, CVP 2.5</th><th>BP (PP)</th><th>HR</th><th>CVP (cmH&#8322;O)</th></tr></thead><tbody><tr><td>Clamp the SVC</td><td>{{&#8595; 60/30 (30)}}</td><td>{{&#8593; 92}}</td><td>{{&#8595; 2.0}}</td></tr><tr><td>Clamp the IVC</td><td>{{&#8595;&#8595; 40/20 (20)}}</td><td>{{&#8593; 96}}</td><td>{{&#8595; 1.5}}</td></tr></tbody></table></div><ul class=\"pts\"><li>Less blood reaches the right atrium: {{venous return}}, RA pressure (CVP), preload, SV and CO all fall, so BP and pulse pressure fall.</li><li>The baroreflex answers with &#8593;HR, &#8593;{{contractility}} and &#8593;{{TPR}}.</li><li>The IVC effect is bigger because the IVC carries {{most of the venous return}} (the whole lower body).</li><li>Venous pressure {{upstream}} of the clamp (head and arms for the SVC) rises. On a PV loop, the end-diastolic point moves {{left}}.</li></ul>"},
{"t":"q","id":"H7","src":"AC77","q":"Which hemodynamic change is the most direct and expected consequence of SVC compression?","o":["A significant decrease in right atrial pressure","Increased systemic arterial pressure","Decreased venous pressure in the head, neck and upper limbs","Reduced afterload on the right ventricle","Increased cardiac output from compensation"],"a":0,"ex":"Less blood reaches the RA, so RA pressure falls. Upstream of the block, venous pressure in the head and arms <b>rises</b>; BP and CO fall."},
{"t":"q","id":"H8","src":"AC79","q":"A pressure-volume loop shows the LVEDV point shifted to the <b>left</b>. What happened?","o":["IV fluid injection","Aortic stenosis","SVC occlusion","Digoxin injection"],"a":2,"ex":"A smaller end-diastolic volume means less preload: SVC occlusion cuts venous return. IV fluid shifts EDV right; AS raises the loop&#8217;s pressure; digoxin increases contractility."},
{"t":"q","id":"H9","src":"AC75","core":true,"q":"Which of the following is most likely the effect of nitroglycerin?","o":["Increased renal perfusion","Decreased venous return","Decreased aldosterone secretion","Increased afterload"],"a":1,"ex":"Nitroglycerin releases NO mainly in veins: capacitance rises, blood pools and venous return and preload fall."},
{"t":"q","id":"H10","src":"AC76","q":"ข้อใดเป็นผลของ nitroglycerin <span class=\"muted\">(Which is an effect of nitroglycerin?)</span>","o":["Decreased preload","Increased vasoconstriction","Increased venous return","Decreased venous capacitance","Increased total peripheral resistance"],"a":0,"ex":"Venodilation raises venous capacitance and lowers preload; it does not constrict or raise TPR."},
{"t":"q","id":"H11","src":"AC78","q":"Which would <b>directly</b> (without compensation) decrease CVP?","o":["Increased venodilation","Increased cardiac vagal tone","Increased blood volume","Decreased TPR","Exhalation in normal breathing"],"a":0,"ex":"Venodilation lets the same volume sit in a bigger space, so pressure falls. Vagal slowing backs blood up (CVP rises), more volume raises CVP, lower TPR speeds venous return toward the heart, and exhalation raises intrathoracic pressure."},
{"t":"q","id":"H12","src":"AC79","core":true,"q":"A manipulation makes CVP <b>increase</b> significantly while venous return <b>decreases</b>. Which manipulation most directly produces this?","o":["Rapid IV administration of a large volume of isotonic saline","A systemic venodilator such as nitroglycerin","Injecting fluid into the pericardial sac","A positive inotropic agent","High PEEP during mechanical ventilation"],"a":2,"ex":"Tamponade blocks filling: blood backs up (CVP up) but less returns into the heart. Saline raises both CVP and VR; nitroglycerin lowers both; an inotrope lowers CVP. High PEEP can do something similar but less directly."},
{"t":"c","id":"H-C3","title":"Cardiac tamponade in the dog","html":"<figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/dog2-tamponade.png\" width=\"1290\" height=\"563\" alt=\"Exp 1: raising intrapericardial pressure through a cannula from a water manometer.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 1: raising intrapericardial pressure through a cannula from a water manometer. <span class=\"src\">Dog II lab sheet, Exp 1</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th></th><th>BP (PP)</th><th>HR</th><th>CVP (cmH&#8322;O)</th></tr></thead><tbody><tr><td>Control</td><td>100/50 (50)</td><td>88</td><td>2</td></tr><tr><td>Intrapericardial pressure raised</td><td>{{&#8595;&#8595; 20/10 (10)}}</td><td>{{80}}</td><td>{{&#8593; 3}}</td></tr></tbody></table></div><ul class=\"pts\"><li>Fluid in the pericardial sac squeezes the heart during {{diastole}}. The chambers cannot fill: <b>venous return {{falls}}</b>, yet the pressure in the RA and veins <b>{{rises}}</b> (CVP up).</li><li>Preload, SV and CO fall &#8594; BP falls and pulse pressure {{narrows}}. Afterload, judged by aortic pressure, also {{falls}}.</li><li>Expected: reflex {{tachycardia}}. In this recording HR fell slightly (88 &#8594; 80), and the lab sheet asks you to explain why, so do not assume every trace follows the textbook.</li><li>Pulsus paradoxus: inspiration fills the right heart, the septum bulges left, and SBP drops by more than {{10 mmHg}}.</li><li>Treatment: remove the fluid ({{pericardiocentesis}}).</li></ul>"},
{"t":"q","id":"H13","src":"AC78","core":true,"q":"A man was stabbed in the heart and has cardiac tamponade. Which set of changes in LV preload, LV cardiac output and LV afterload is correct?","o":["Decreased, decreased, increased","Decreased, decreased, decreased","Decreased, increased, increased","Increased, increased, decreased","Increased, increased, increased"],"a":1,"ex":"Filling is blocked (preload down), so CO falls and aortic pressure falls; with a small, under-filled LV, afterload (aortic pressure, wall stress) is also lower. If you count only the reflex rise in TPR you would pick A, but afterload follows aortic pressure."},
{"t":"tf","id":"H14","src":"Lab quiz","q":"Pericardial effusion causes decreased venous return and increased pulse pressure.","a":false,"ex":"Venous return falls, and pulse pressure <b>narrows</b> because stroke volume is small."},
{"t":"q","id":"H15","src":"AC81","core":true,"q":"In the dog lab a stylet destroys the aortic valve, causing acute aortic regurgitation. What happens to end-diastolic volume, stroke volume, diastolic BP and pulse pressure, respectively?","o":["Increased, increased, increased, increased","Increased, increased, increased, unchanged","Decreased, increased, decreased, decreased","Decreased, unchanged, increased, increased","Increased, increased, decreased, increased"],"a":4,"ex":"Backflow adds to filling (EDV up), Frank&#8211;Starling raises total SV, diastolic pressure drains back into the LV (DBP down), and a high SBP with a low DBP gives a wide pulse pressure."},
{"t":"q","id":"H16","src":"AC78","core":true,"q":"A patient has had a diastolic blowing murmur at the right upper parasternal border for many years. Which parameter is <b>decreased</b>?","o":["Stroke volume","LV preload","Systolic BP","Diastolic BP","LVEDV"],"a":3,"ex":"Right upper parasternal + diastolic = aortic regurgitation. DBP falls; SV, preload, LVEDV and SBP all rise."},
{"t":"q","id":"H17","src":"AC80","q":"A patient has aortic regurgitation. Which part of the LV pressure-volume loop is expected to shift?","fig":"<figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/ac80-pvloop.png\" width=\"1296\" height=\"730\" alt=\"AC80 exam figure\" loading=\"lazy\" decoding=\"async\"></div><figcaption class=\"srconly\"><span class=\"src\">AC80 exam figure</span></figcaption></figure>","o":["I shifts to the right","D shifts downward","E shifts downward along the line","A shifts left","B unchanged"],"a":0,"ex":"I is the end-diastolic volume. Regurgitant blood adds to filling, so I moves right (and B with it). Peak pressure D rises rather than falls."},
{"t":"c","id":"H-C4","title":"Aortic regurgitation","html":"<figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/dog2-ar.png\" width=\"1320\" height=\"485\" alt=\"Exp 6: a stylet passed down the left common carotid destroys the aortic valve.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 6: a stylet passed down the left common carotid destroys the aortic valve. <span class=\"src\">Dog II lab sheet, Exp 6</span></figcaption></figure><div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/ac80-pvloop.png\" width=\"1296\" height=\"730\" alt=\"The LV pressure&#8211;volume loop from the AC80 question.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>The LV pressure&#8211;volume loop from the AC80 question. <span class=\"src\">AC80 exam figure</span></figcaption></figure><ul class=\"pts\"><li>In the dog: control 90/45 (PP 45), HR 110 &#8594; after the valve is destroyed {{100/40 (PP 60)}}, HR 100, CVP {{not changed}}.</li><li>Loop: B = end-diastole (mitral closes, volume I = {{EDV}}) &#8594; C = aortic valve opens &#8594; D = peak pressure &#8594; E = aortic valve closes on the ESPVR &#8594; A = mitral opens (volume H = {{ESV}}) &#8594; filling back to B.</li><li><b>AR</b>: blood leaks back from the aorta in diastole, so the LV fills from two sides: <b>EDV (I) moves {{right}}</b>, total SV {{rises}}, SBP rises, DBP {{falls}} (C moves down), pulse pressure {{widens}}, collapsing pulse. There is no true isovolumetric relaxation.</li><li>Pulse pressure overestimates useful flow in AR: part of each stroke runs back into the LV, so {{effective}} forward SV is lower.</li></ul></div>"},
{"t":"tf","id":"H18","src":"Lab quiz","q":"Aortic regurgitation narrows the pulse pressure.","a":false,"ex":"It widens it: DBP falls as blood flows back, and SBP rises with the larger stroke volume."},
{"t":"tf","id":"H19","src":"Lab quiz","q":"Pulse pressure can be used to estimate the effective stroke volume in all conditions.","a":false,"ex":"It works in normal people, but in AR pulse pressure is high while effective forward SV is reduced."},
{"t":"tf","id":"H20","src":"Lab quiz","q":"Aortic stenosis can cause CVP elevation.","a":true,"ex":"Obstructed forward flow raises pressure backward through the LA, lungs and right heart."},
{"t":"q","id":"H21","src":"AC78","core":true,"q":"A 1-month-old baby has coarctation of the aorta distal to the origin of the left subclavian artery. Which is correct for BP proximal to the lesion, BP distal to the lesion and LV afterload?","o":["Decreased, decreased, unchanged","Decreased, unchanged, increased","Increased, decreased, increased","Increased, decreased, unchanged","Increased, increased, unchanged"],"a":2,"ex":"The narrowing is a resistance in series: pressure builds up before it (arms high), drops after it (legs low), and the LV must pump against more resistance (afterload up)."},
{"t":"c","id":"H-C5","title":"Real tracings: clamping the aorta (stenosis and coarctation models)","src":"Dog II","html":"<div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog2-ascaorta.png\" width=\"1290\" height=\"582\" alt=\"Exp 3.1: occluding the ascending aorta; BP measured at the carotid.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 3.1: occluding the ascending aorta; BP measured at the carotid. <span class=\"src\">Dog II lab sheet, Exp 3.1</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog2-aorticarch.png\" width=\"1350\" height=\"514\" alt=\"Exp 3.2: occluding the aortic arch; BP measured at the carotid.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 3.2: occluding the aortic arch; BP measured at the carotid. <span class=\"src\">Dog II lab sheet, Exp 3.2</span></figcaption></figure></div><div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th>Occlusion</th><th>Carotid BP</th><th>HR</th><th>CVP</th><th>Models</th></tr></thead><tbody><tr><td>Ascending aorta (the carotid branches off <b>after</b> the block)</td><td>{{&#8595;&#8595; 100/50 &#8594; 30/20}}</td><td>90 &#8594; 70</td><td>{{&#8593; 2.5 &#8594; 3.5}}</td><td>Severe {{aortic stenosis}}: LV pressure and afterload up, forward flow down, pressure backs up</td></tr><tr><td>Aortic arch (the carotid branches off <b>before</b> the block)</td><td>{{&#8593; 90/40 &#8594; 130/80}}</td><td>96 &#8594; 90</td><td>2.5 &#8594; 3.0</td><td>{{Coarctation}}: high before the narrowing, low after it</td></tr></tbody></table></div><ul class=\"pts\"><li><b>Coarctation</b> distal to the left subclavian: BP {{high}} in the arms and carotids, {{low and delayed}} in the legs (femoral), LV afterload {{up}}.</li><li><b>Aortic stenosis</b>: high LV pressure and afterload, a small slow pulse (parvus et tardus); pressure can back up to {{raise CVP}}.</li><li>HR fell with the ascending-aorta clamp even though carotid BP fell; the lab sheet asks why. Another trace that does not follow the simple baroreflex story.</li></ul>"},
{"t":"tf","id":"H22","src":"Lab quiz","q":"In coarctation of the aorta, blood pressure is increased proximal to the lesion and decreased distal to it.","a":true,"ex":"Proximal arteries (arms, head) see the high pressure; distal flow is reduced."},
{"t":"tf","id":"H23","src":"Lab quiz","q":"Blood pressure and respiratory rate can be increased or decreased by electrical stimulation of the aortic nerve.","a":true,"ex":"Low current excites large baroreceptor fibers (BP and RR fall); high current excites small chemoreceptor fibers from the aortic bodies (BP and RR rise)."},
{"t":"c","id":"H-C6","title":"Real tracings: aortic nerve and right vagus","src":"Dog II","html":"<div class=\"scanrow\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog2-aorticnerve.png\" width=\"1245\" height=\"608\" alt=\"Exp 4: aortic nerve stimulation, (A) low and (B) high current.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 4: aortic nerve stimulation, (A) low and (B) high current. <span class=\"src\">Dog II lab sheet, Exp 4</span></figcaption></figure><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/dog2-rvagus.png\" width=\"1320\" height=\"495\" alt=\"Exp 5: right vagus, peripheral cut end, electrical stimulation.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 5: right vagus, peripheral cut end, electrical stimulation. <span class=\"src\">Dog II lab sheet, Exp 5</span></figcaption></figure></div><div class=\"tblwrap\"><table class=\"tbl dogtbl\"><thead><tr><th>Control 90/40, HR 96</th><th>BP</th><th>HR</th><th>Why</th></tr></thead><tbody><tr><td>Aortic nerve, <b>low</b> current (A)</td><td>{{&#8595; 65/20}}</td><td>{{&#8595; 80}}</td><td>Large {{baroreceptor}} fibers: depressor</td></tr><tr><td>Aortic nerve, <b>high</b> current (B)</td><td>{{&#8593; 135/85}}</td><td>{{&#8593; 110}}</td><td>Small {{chemoreceptor}} fibers join in: pressor</td></tr><tr><td>Right vagus, peripheral end</td><td>{{&#8595;&#8595; 20/0}}</td><td>{{no heartbeat}}</td><td>ACh on the {{SA node}}: arrest</td></tr></tbody></table></div><ul class=\"pts\"><li>In the dog the aortic nerve carries afferents from the aortic-arch baroreceptors and the aortic bodies, and runs in the left vagosympathetic trunk to the brainstem.</li><li>So aortic-nerve stimulation can push BP and RR {{either way}}, depending on the current.</li><li>Right vagus &#8594; SA node &#8594; rate; left vagus &#8594; AV node &#8594; conduction. The turtle lab showed the same split.</li></ul>"},
{"t":"tf","id":"H24","src":"Lab quiz","q":"In humans, left vagus stimulation mainly causes bradycardia, while right vagus stimulation mainly causes heart block.","a":false,"ex":"It is the other way round: right vagus &#8594; SA node &#8594; bradycardia; left vagus &#8594; AV node &#8594; heart block."},
{"t":"q","id":"H25","src":"AC76","q":"What is the most common site of origin of atrial fibrillation?","o":["Right atrium","Left atrium","Right ventricle","Right atrial appendage","Left atrial appendage"],"a":1,"ex":"Most AF is triggered by ectopic firing around the pulmonary vein openings in the left atrium. The left atrial appendage is where clots form, not where AF starts."},
{"t":"q","id":"H26","src":"AC77","q":"What is an ECG finding during atrial fibrillation?","o":["Regular rhythm","Pulse deficit","Tall P wave","Narrow QRS complexes","Slow ventricular rate"],"a":3,"ex":"Conduction below the AV node is normal, so QRS stays narrow. The rhythm is irregular, P waves are absent and the rate is usually fast. A pulse deficit is a bedside finding, not an ECG finding."},
{"t":"tf","id":"H27","src":"Lab quiz","core":true,"q":"In atrial fibrillation, the disorganized electrical activity originates primarily from the AV node, leading to the irregular rhythm.","a":false,"ex":"The chaos is in the atria. The AV node passes some of the impulses on at irregular intervals."},
{"t":"c","id":"H-C7","title":"Arrhythmias seen in the lab: AF and VF","html":"<figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/dog2-afvf.png\" width=\"1320\" height=\"499\" alt=\"Exp 7: stimulating the atrium (atrial fibrillation), then the ventricle (ventricular fibrillation).\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Exp 7: stimulating the atrium (atrial fibrillation), then the ventricle (ventricular fibrillation). <span class=\"src\">Dog II lab sheet, Exp 7</span></figcaption></figure><div class=\"cols2\"><div class=\"mini\"><h4>Atrial fibrillation</h4><ul><li>In the dog: control 100/40, HR 100 &#8594; during AF BP {{125/20}} (PP 105), HR {{50, irregular}}; back to 100/40, HR 100 (regular) once the stimulus stops. CVP stays 2.5.</li><li>Starts in the <b>{{atria}}</b>, most often around the {{pulmonary veins}} in the left atrium; the AV node only passes on irregular impulses</li><li>ECG: no P waves, irregularly irregular RR, usually <b>{{narrow}}</b> QRS, often fast</li><li>Exam: irregular pulse, <b>{{pulse deficit}}</b>, no a wave in the JVP, no S4</li></ul></div><div class=\"mini art\"><h4>Ventricular fibrillation</h4><ul><li>In the dog: ventricle stimulation &#8594; the BP trace falls to a flat line with {{no heartbeat}}, and unlike AF it does {{not stop}} when the stimulus stops</li><li>Ventricles quiver without a coordinated beat</li><li>No stroke volume: <b>{{no palpable pulse}}</b>, BP falls toward zero</li><li>Needs immediate {{defibrillation}}</li></ul></div></div>"},
{"t":"tf","id":"H28","src":"Lab quiz","q":"The radial pulse can still be palpated in ventricular fibrillation, but with less intensity.","a":false,"ex":"In VF there is no coordinated contraction and no stroke volume, so there is no pulse at all."}

(function () {

  var $ = function (id) { return document.getElementById(id); };
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem('cvsdeck:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('cvsdeck:' + k, JSON.stringify(v)); } catch (e) { } }

  var byId = {}, secOf = {};
  S.forEach(function (s, si) { s.items.forEach(function (it) { byId[it.id] = it; secOf[it.id] = si; }); });

  function counts(s) { var c = { c: 0, q: 0, core: 0 }; s.items.forEach(function (it) { if (it.t === 'c') c.c++; else { c.q++; if (it.core) c.core++; } }); return c; }
  function find(id) { for (var i = 0; i < seq.length; i++) { if (seq[i].id === id) return i; } return -1; }

    S.forEach(function (s, si) {

      s.items.forEach(function (it) { if (coreOnly && isQ(it) && !it.core) return; seq.push(it); });
    });
  }

  /* ---------- renderers ---------- */
  function eyebrow(it) {

    var h = '<div class="eyebrow"><span class="id">' + it.id + '</span>';
    h += it.t === 'c' ? '<span class="chip kind">Concept</span>' : '<span class="chip">' + (it.t === 'tf' ? 'True / False' : it.t === 'open' ? 'Think and explain' : 'MCQ') + '</span>';

    if (it.group) h += '<span class="chip grp">' + it.group + '</span>';
    return h + '<span class="sp"></span><span>' + s.short + '</span></div>';
  }
  function answerText(it) {

      var A = [].concat(it.a);

    if (it.t === 'tf') return 'Answer: ' + (it.a ? 'True' : 'False');
    return 'Model answer';
  }
  function renderQ(it, browse) {
    var st = state[it.id] || {};
    var h = '<article class="card qcard' + (st.rev ? ' rev' : '') + '" data-id="' + it.id + '">' + eyebrow(it) + '<div class="stem">' + it.q + '</div>';

    if (it.t === 'q') {
      var A = [].concat(it.a);
      h += '<ol class="opts">' + it.o.map(function (o, i) {
        return '<li><button type="button" class="opt' + (A.indexOf(i) >= 0 ? ' isans' : '') + (st.sel === i ? ' sel' : '') + '" data-v="' + i + '"><span class="L">' + LET[i] + '</span><span class="ot">' + o + '</span><span class="mk" aria-hidden="true"></span></button></li>';
      }).join('') + '</ol>';
    } else if (it.t === 'tf') {

  }
  function renderC(it) {

  }
  function renderSec(si) {

    return '<article class="card secard"><div class="eyebrow"><span class="chip kind">' + s.kind + '</span><span class="id">Section ' + s.id + '</span><span class="chip">' + (si + 1) + ' of ' + S.length + '</span></div>' +
      '<h2>' + s.title + '</h2><p class="lede">' + s.blurb + '</p>' +

      '<h3 class="minih">Concept cards in this section</h3><ol class="toc">' + toc + '</ol></article>';
  }
  function renderIntro() {

    S.forEach(function (s) { var c = counts(s); tot += c.q; core += c.core; });

      '<h2>CVS I Regulation &amp; Lab</h2><p class="lede">Question first, concept second. ' + tot + ' past-exam and lab-quiz questions on the regulation lecture and every lab except ECG; ' + core + ' are marked core for the video.</p>' +
      '<div class="stations">' + st + '</div>' +
      '<div class="howto"><div><b>Ask</b>Read the stem, wait 10 seconds, click the option most people would pick.</div>' +

      '<div><b>Keys</b><kbd>&#8592;</kbd> <kbd>&#8594;</kbd> move, <kbd>A</kbd>&#8211;<kbd>F</kbd> choose, <kbd>T</kbd>/<kbd>F</kbd> true-false, <kbd>R</kbd> reset, <kbd>B</kbd> browse</div></div>' +

  }

  /* ---------- cloze blanks on concept cards ---------- */
  function czOf(card) { return card ? card.querySelectorAll('.cz') : []; }
  function czLeft(card) { var n = 0, cz = czOf(card); for (var i = 0; i < cz.length; i++) if (!cz[i].classList.contains('on')) n++; return n; }
  function czApply(card, id) {
    var on = (state[id] || {}).cz || [], cz = czOf(card);

  function czSave(card, id) {
