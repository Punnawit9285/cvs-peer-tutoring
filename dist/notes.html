CVS.add({"id":"B","short":"BP lab","title":"Lab: Blood Pressure Measurement","kind":"Lab","blurb":"Indirect measurement, cuff choice, Korotkoff sounds, sources of error, arm versus leg, posture and exercise.","items":[
{"t":"c","id":"B-C1","title":"Reading a blood pressure","src":"Lab direction","html":"<div class=\"eqn\">MAP &#8776; DBP + {{&#8531;}}(SBP &#8722; DBP)</div><div class=\"cols3\"><div class=\"mini\"><h4>Systolic (SBP)</h4><p>Peak during ejection. Mainly set by {{stroke volume and arterial stiffness}}.</p></div><div class=\"mini\"><h4>Diastolic (DBP)</h4><p>Lowest point in diastole. Mainly set by {{peripheral resistance}} (how fast blood runs off).</p></div><div class=\"mini\"><h4>Pulse pressure</h4><p>SBP &#8722; DBP. Tracks {{stroke volume}} in normal people. Wide: {{AR, stiff arteries, exercise}}. Narrow: {{AS, tamponade, hypovolemia}}.</p></div></div><p class=\"note\">Why one third? At rest diastole lasts about {{twice as long}} as systole, so the time-average sits one third of the way up from DBP.</p><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Method</th><th>How</th><th>Gives</th><th>Use</th></tr></thead><tbody><tr><td><b>Direct</b> (intra-arterial line)</td><td>Catheter in an artery + transducer</td><td>Beat-to-beat SBP, DBP, MAP</td><td>ICU, operating room, animal labs. Invasive.</td></tr><tr><td><b>Auscultatory</b></td><td>Sphygmomanometer + stethoscope, Korotkoff sounds</td><td>SBP and DBP</td><td>Noninvasive reference method</td></tr><tr><td><b>Palpatory</b></td><td>Radial pulse returns as the cuff deflates</td><td>{{SBP only}}</td><td>Quick estimate before auscultation</td></tr><tr><td><b>Oscillometric</b></td><td>Automatic cuff senses wall oscillations ({{maximum = MAP}})</td><td>SBP, DBP calculated</td><td>Home, ward and ICU monitors</td></tr></tbody></table></div><p class=\"note\">Indirect methods differ from direct readings by about {{&#177;10 mmHg}}.</p>"},
{"t":"tf","id":"B1","src":"Lab quiz","core":true,"q":"Measurement of blood pressure by sphygmomanometer is considered to be a direct method of blood pressure measurement.","a":false,"ex":"It is indirect: the cuff squeezes the artery from outside. The direct method places a catheter inside an artery."},
{"t":"q","id":"B2","src":"AC77","q":"What is the gold standard of <b>noninvasive</b> blood pressure measurement?","o":["Stethoscope","Sphygmomanometer","Intra-arterial blood pressure monitoring","Oscillometric device"],"a":1,"ex":"Auscultation with a (mercury) sphygmomanometer is the reference noninvasive method, and automated devices are validated against it. An intra-arterial line is the overall gold standard but it is invasive."},
{"t":"q","id":"B3","src":"AC78","flag":"Truly continuous, beat-to-beat monitoring uses an arterial line, which is not among the options.","q":"In continuous critical care, which method is most commonly used to monitor blood pressure?","o":["Oscillometer","Auscultatory method","Palpatory method","Sphygmomanometer","Ultrasound Doppler"],"a":0,"ex":"Bedside monitors use automated oscillometric cuffs for repeated noninvasive readings: the point of maximal oscillation is MAP, and SBP and DBP are calculated from it."},
{"t":"q","id":"B4","src":"AC80","core":true,"q":"A patient has a blood pressure of <b>126/72</b> mmHg. Find the mean arterial pressure.","o":["54","72","90","99","126"],"a":2,"ex":"PP = 126 &#8722; 72 = 54. MAP = 72 + 54/3 = 72 + 18 = <b>90 mmHg</b>."},
{"t":"q","id":"B5","src":"AC76","q":"What is the MAP of a patient with blood pressure of 160/100 mmHg?","o":["115 mmHg","120 mmHg","130 mmHg","140 mmHg","145 mmHg"],"a":1,"ex":"MAP = 100 + (60/3) = 120 mmHg."},
{"t":"q","id":"B6","src":"AC77","q":"The patient has a BP of 126/60. Calculate the MAP.","o":["60","82","93","104","126"],"a":1,"ex":"MAP = 60 + (66/3) = 60 + 22 = 82 mmHg."},
{"t":"q","id":"B7","src":"AC78","q":"A patient records 110/70 at home and 140/80 at the hospital. What is the difference in MAP between the two measurements?","o":["9 mmHg","13 mmHg","17 mmHg","20 mmHg","30 mmHg"],"a":2,"ex":"Home: 70 + 40/3 = 83.3. Hospital: 80 + 60/3 = 100. Difference &#8776; 16.7, about <b>17 mmHg</b>. A classic white-coat effect."},
{"t":"q","id":"B8","src":"AC79","q":"A patient&#8217;s blood pressure is 120/60 mmHg. What is the calculated MAP?","o":["70 mmHg","80 mmHg","90 mmHg","100 mmHg","120 mmHg"],"a":1,"ex":"MAP = 60 + 60/3 = 80 mmHg."},
{"t":"q","id":"B9","src":"AC81","core":true,"q":"Results show a mean arterial pressure of <b>80</b> mmHg and a pulse pressure of <b>60</b> mmHg. What is his systolic blood pressure?","o":["120 mmHg","100 mmHg","80 mmHg","160 mmHg","75 mmHg"],"a":0,"ex":"Work backwards: DBP = MAP &#8722; PP/3 = 80 &#8722; 20 = 60. SBP = DBP + PP = 60 + 60 = <b>120</b>."},
{"t":"tf","id":"B10","src":"Lab quiz","q":"A person with a blood pressure of 85/40 mmHg is in a state of shock.","a":false,"ex":"Shock means inadequate tissue perfusion. Low BP alone does not prove it; look for signs of poor perfusion (mental status, cold clammy skin, slow capillary refill, low urine output, lactate)."},
{"t":"c","id":"B-C2","title":"Doing it right: preparation, cuff and the two-step method","src":"Lab direction","html":"<div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/bp-prep.png\" width=\"1264\" height=\"826\" alt=\"Fig 1 of the BP manual: what to check before and during the measurement.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 1 of the BP manual: what to check before and during the measurement. <span class=\"src\">BP lab manual, Fig 1</span></figcaption></figure><div class=\"mini\"><h4>Prepare the subject</h4><ul><li>No smoking, caffeine, food or exercise for {{30 min}}; empty the bladder; rest {{5 min}} in a quiet room</li><li>Seated, back supported, feet flat, legs uncrossed, {{no talking}}</li><li>Arm bare, supported, palm up, cuff at <b>{{heart level}}</b></li><li>Lower cuff edge {{~2.5 cm (1 inch)}} above the elbow crease; bladder centre over the brachial artery; snug fit</li><li>Mercury zero at heart level; read the meniscus at eye level</li></ul></div></div><div class=\"cols2\"><div class=\"mini\"><h4>Cuff size</h4><p>Bladder <b>width &#8776; {{40%}}</b> of mid-arm circumference; bladder <b>length {{80&#8211;100%}}</b> of it.</p></div><div class=\"tblwrap\"><table class=\"tbl compact\"><thead><tr><th>Cuff</th><th>Bladder (cm)</th><th>Arm (cm)</th></tr></thead><tbody><tr><td>Newborn</td><td class=\"num\">3 &#215; 6</td><td class=\"num\">&#8804; 6</td></tr><tr><td>Infant</td><td class=\"num\">5 &#215; 15</td><td class=\"num\">6&#8211;15</td></tr><tr><td>Child</td><td class=\"num\">8 &#215; 21</td><td class=\"num\">16&#8211;21</td></tr><tr><td>Small adult</td><td class=\"num\">10 &#215; 24</td><td class=\"num\">22&#8211;26</td></tr><tr><td>Adult</td><td class=\"num\">13 &#215; 30</td><td class=\"num\">27&#8211;34</td></tr><tr><td>Large adult</td><td class=\"num\">16 &#215; 38</td><td class=\"num\">35&#8211;44</td></tr><tr><td>Adult thigh</td><td class=\"num\">20 &#215; 42</td><td class=\"num\">45&#8211;52</td></tr></tbody></table></div></div><ol class=\"steps\"><li><b>Palpate first</b>: feel the radial pulse, inflate until it disappears, then {{20&#8211;30 mmHg}} more. Deflate about {{2 mmHg per beat}}; the pressure at which the pulse returns is the {{palpatory SBP}}. DBP cannot be judged reliably by palpation.</li><li><b>Then auscultate</b>: bell or diaphragm over the brachial artery at the elbow (not under the cuff). Inflate quickly to 20&#8211;30 above the palpatory SBP, deflate slowly (about {{1 mmHg per second}} in the manual): first tapping = SBP, disappearance = DBP.</li><li>Palpating first avoids being fooled by an <b>{{auscultatory gap}}</b> (a silent stretch below SBP in some hypertensive patients) and avoids pumping far too high.</li></ol>"},
{"t":"c","id":"B-C3","title":"Korotkoff sounds","html":"<div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Phase</th><th>Sound</th><th>Meaning</th></tr></thead><tbody><tr><td class=\"num\">I</td><td>{{First clear tapping}}</td><td><b>{{SBP}}</b>: the cuff has just fallen below the pressure peaks, so blood spurts through</td></tr><tr><td class=\"num\">II</td><td>{{Softer swishing}}</td><td>&#8212;</td></tr><tr><td class=\"num\">III</td><td>{{Crisper, louder tapping}}</td><td>&#8212;</td></tr><tr><td class=\"num\">IV</td><td>{{Sudden muffling}}</td><td>Used as DBP in children, pregnancy, high-output states and AR, where sounds may go on to 0</td></tr><tr><td class=\"num\">V</td><td>{{Silence}}</td><td><b>{{DBP}}</b> in adults: the artery stays open all through the beat and flow is smooth again</td></tr></tbody></table></div><p class=\"note\">The sounds come from {{turbulent}}, jet-like flow through a partly compressed artery. Above SBP the artery is {{shut}} (silent); below DBP flow is {{laminar}} (silent).</p>"},
{"t":"q","id":"B11","src":"AC76","core":true,"q":"ได้ยิน Korotkoff sound ของ systolic ที่เสียงที่เท่าไหร่? <span class=\"muted\">(Which Korotkoff sound marks systolic pressure?)</span>","o":["1st Korotkoff sound","2nd Korotkoff sound","3rd Korotkoff sound","4th Korotkoff sound","5th Korotkoff sound"],"a":0,"ex":"Phase I, the first clear tapping, is SBP. Phase V (disappearance) is DBP in adults; phase IV (muffling) is used when sounds persist."},
{"t":"q","id":"B12","src":"AC75&#8211;79","q":"With the auscultatory method, which event accurately indicates the systolic blood pressure?","o":["The point at which the Korotkoff sounds completely disappear","The pressure when the Korotkoff sounds first become audible","The pressure at which the sounds become muffled","The reading obtained during the patient&#8217;s inspiration","The average of the highest and lowest audible pressures"],"a":1,"ex":"First audible sound = SBP. Disappearance = DBP; muffling = phase IV."},
{"t":"q","id":"B13","src":"AC78","q":"Which factor is <b>NOT</b> relevant when determining the appropriate cuff size?","o":["Height","Age","Part of the body (upper arm, forearm)","Mid-arm circumference","Length of the upper arm"],"a":0,"ex":"Cuff size follows the limb: its circumference (bladder width ~40%, length 80&#8211;100%), the site and the limb length, and age group sets which range of cuffs you pick from. Body height plays no part."},
{"t":"c","id":"B-C4","title":"Falsely high or falsely low?","src":"Lab direction &#183; lab quiz","html":"<div class=\"tblwrap\"><table class=\"tbl twocol\"><thead><tr><th class=\"up\">Reads falsely HIGH</th><th class=\"dn\">Reads falsely LOW</th></tr></thead><tbody><tr><td>Cuff too <b>{{small}}</b> (narrow bladder needs extra pressure to close the artery)</td><td>Cuff too <b>{{large}}</b></td></tr><tr><td>Cuff too <b>{{loose}}</b> (bladder balloons, acts narrower)</td><td>Cuff too <b>{{tight}}</b> (course key)</td></tr><tr><td>Arm <b>{{below}}</b> heart level (hydrostatic, about {{+0.8 mmHg per cm}})</td><td>Arm <b>{{above}}</b> heart level</td></tr><tr><td>Arm unsupported or fist clenched (muscle tension)</td><td>Deflating <b>{{too fast}}</b> (SBP missed and read low; DBP may read high)</td></tr><tr><td>Talking, full bladder, caffeine, smoking, recent exercise, anxiety or white-coat effect</td><td>Auscultatory gap missed (no palpatory estimate first)</td></tr><tr><td>Back unsupported, legs crossed; cuff over a sleeve</td><td>Stethoscope pressed hard (sounds persist lower, {{DBP reads low}})</td></tr></tbody></table></div><p class=\"note\">Either direction: mercury not at zero, an uncalibrated aneroid gauge, or a cuff left inflated above DBP for too long (venous congestion and local mediators change the vessel).</p>"},
{"t":"q","id":"B14","src":"AC76","core":true,"q":"ข้อใดทำให้อ่านผล BP น้อยเกินจริง <span class=\"muted\">(Which makes the BP reading falsely LOW?)</span>","o":["รัด cuff แน่นไป (cuff too tight)","cuff เล็กไป (cuff too small)","รัด cuff หลวมไป (cuff too loose)","กินชา + กาแฟมาก่อนวัด (tea/coffee before)","พูดขณะวัด (talking during measurement)"],"a":0,"ex":"Course key (and lab quiz item 9): a cuff wrapped too tightly reads falsely low. A small cuff, a loose cuff, caffeine and talking all read falsely high."},
{"t":"q","id":"B15","src":"AC80","core":true,"q":"A patient with hypertension has his BP measured with a sphygmomanometer: 120/80. Which might cause the result to be falsely low?","o":["Talking while measuring","Small cuff","Loose cuff","The patient&#8217;s hand is placed below heart level","Reducing the cuff pressure too fast"],"a":4,"ex":"Deflating too fast carries the cuff well below the true systolic level before the first sound is heard, so SBP reads low. Every other option reads high."},
{"t":"q","id":"B16","src":"AC81","core":true,"q":"A 65-year-old man with essential hypertension measures 120/80 mmHg. What can be the cause of the falsely low blood pressure?","o":["Large cuff","Loose cuff","Smoking before examination","Talking during examination","Arm positioned below the heart"],"a":0,"ex":"A cuff that is too big spreads its pressure over a wide area and closes the artery at a lower cuff pressure. The other four read high."},
{"t":"tf","id":"B17","src":"Lab quiz","q":"If the cuff bladder width is 20% of the mid-upper-arm circumference, the measurement will be falsely high.","a":true,"ex":"A narrow bladder needs more pressure to compress the artery. Proper width is about 40% of the circumference."},
{"t":"tf","id":"B18","src":"Lab quiz","q":"If the bladder length is twice the mid-upper-arm circumference, the measurement will be inaccurately high.","a":false,"ex":"An oversized cuff reads falsely <b>low</b>. Bladder length should encircle 80&#8211;100% of the arm."},
{"t":"tf","id":"B19","src":"Lab quiz","q":"If a properly sized cuff is wrapped too tightly on a subject&#8217;s arm, the blood pressure will be falsely high.","a":false,"ex":"Per the lab key, an overly tight cuff gives a falsely low reading. (A loose cuff is the one that reads high.)"},
{"t":"c","id":"B-C5","title":"Arms versus legs: where you measure matters","src":"Lab direction &#183; lab quiz","html":"<ul class=\"pts\"><li>Lab: measure both arms (brachial) and both legs (popliteal, thigh cuff) after 5 min lying down.</li><li>Normally, supine <b>leg SBP is {{higher}}</b> than arm SBP (by {{~10&#8211;20 mmHg}}). The pressure wave travels faster than the blood and is reflected at branch points, so SBP and pulse pressure <b>{{grow}}</b> downstream, while DBP and MAP fall slightly. Blood still flows downhill in MAP.</li><li>So among the aorta, arteriole, femoral artery, central vein and pulmonary artery, the <b>{{femoral artery}}</b> has the highest systolic pressure.</li><li>Check the other arm whenever one arm reads high: an inter-arm difference above {{10&#8211;15 mmHg}} suggests subclavian stenosis, aortic dissection, Takayasu arteritis or coarctation.</li><li><b>Coarctation</b>: {{arm BP high, leg BP low}}, femoral pulse weak and delayed.</li><li>Ankle-brachial index = ankle SBP / arm SBP; normal {{1.0&#8211;1.4}}; below {{0.9}} suggests peripheral arterial disease.</li></ul>"},
{"t":"tf","id":"B20","src":"Lab quiz","q":"In a patient with high blood pressure in one arm, blood pressure from the other arm should be obtained.","a":true,"ex":"Some causes of hypertension (coarctation, Takayasu arteritis, aortic dissection) give different values in different limbs."},
{"t":"tf","id":"B21","src":"Lab quiz","core":true,"q":"In the supine position, blood pressure measured from the legs is similar to that obtained from the arms.","a":false,"ex":"Leg SBP is normally higher because of pulse-wave amplification and reflected waves, even though MAP is slightly lower downstream."},
{"t":"q","id":"B22","src":"AC78","q":"Which structure has the highest systolic pressure?","o":["Aorta","Arteriole","Femoral artery","Central vein","Pulmonary artery"],"a":2,"ex":"Systolic pressure and pulse pressure increase from the aorta toward peripheral arteries such as the femoral artery (pulse-wave amplification). Arterioles, veins and the pulmonary artery are far lower."},
{"t":"c","id":"B-C6","title":"Changing posture","src":"Lab direction &#183; lab quiz","html":"<div class=\"flow\"><div class=\"fbox start\">Lying &#8594; standing</div><div class=\"farrow\">&#8594;</div><div class=\"fbox\">{{~500&#8211;800 mL}} pools in leg veins &#8594; &#8595;venous return &#8594; &#8595;SV, &#8595;CO &#8594; &#8595;BP at the carotid sinus</div><div class=\"farrow\">&#8594;</div><div class=\"fbox\">Baroreceptors fire <b>{{less}}</b> &#8594; &#8593;sympathetic, &#8595;vagal</div><div class=\"farrow\">&#8594;</div><div class=\"fbox end\">&#8593;HR ({{+10&#8211;20}}), vasoconstriction (&#8593;TPR), venoconstriction &#8594; BP restored within seconds</div></div><ul class=\"pts\"><li>Typical standing result: HR up, DBP slightly up, SBP slightly down or unchanged, pulse pressure narrower. <b>CO stays {{20&#8211;30%}} lower</b> than lying, despite the reflex.</li><li>Orthostatic hypotension: SBP falls {{&#8805; 20}} or DBP {{&#8805; 10}} mmHg within 3 min of standing.</li><li>Standing &#8594; lying: venous return rises, BP rises, baroreceptors fire <b>{{more}}</b> &#8594; HR falls. In the dog, BP first {{rises, then falls back}} as the reflex acts.</li><li>Lab protocol: lie 5 min, then stand; measure immediately, at 3 min and at 6 min.</li></ul>"},
{"t":"q","id":"B23","src":"AC77","core":true,"q":"Which finding is correlated with changing position from <b>supine to upright</b>?","o":["Accumulation of blood in the lower extremities","Bradycardia","Dilatation of the external iliac artery","Increased stimulation of baroreceptors","Increased venous return"],"a":0,"ex":"Gravity pools blood in the leg veins, which lowers venous return and BP. Baroreceptors are stimulated less, so HR goes up, not down."},
{"t":"q","id":"B24","src":"AC77","q":"Which of the following happens after changing from <b>upright to supine</b>?","o":["Increased heart rate","Decreased venous compliance","Increased cardiac contractility","Decreased parasympathetic tone","Increased stimulation of the baroreceptor reflex"],"a":4,"ex":"Lying down returns pooled blood to the chest: SV and BP rise, the carotid sinus stretches more, and the reflex slows the heart and lowers sympathetic tone."},
{"t":"tf","id":"B25","src":"Lab quiz","q":"On changing from supine to upright, cardiac output can still be decreased in spite of the stimulated sympathetic activity.","a":true,"ex":"CO typically stays 20&#8211;30% lower while standing; the reflex restores BP mostly through resistance and heart rate."},
{"t":"tf","id":"B26","src":"Lab quiz","q":"When changing position from upright to supine, stimulation of the baroreceptor reflex will be decreased.","a":false,"ex":"It increases: pressure at the carotid sinus rises when you lie down."},
{"t":"q","id":"B27","src":"AC76","flag":"Only two options were recalled.","q":"If the right vagus nerve is cut before changing position from supine to upright, what will happen?","o":["Hypotension","Heart rate increases"],"a":1,"ex":"Cutting one vagus removes part of the resting vagal tone, so HR is already higher. The carotid sinus afferents (CN IX) and the sympathetic outflow are intact, so on standing the reflex still raises HR and TPR and BP is maintained."},
{"t":"c","id":"B-C7","title":"Exercise and recovery","src":"Lab direction &#183; lab quiz","html":"<div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th></th><th>Before</th><th>Right after</th><th>3 min</th><th>6 min</th></tr></thead><tbody><tr><td>Heart rate</td><td>baseline</td><td class=\"up\">{{&#8593;&#8593;}}</td><td class=\"up\">&#8593;</td><td>near baseline</td></tr><tr><td>Systolic BP</td><td>baseline</td><td class=\"up\">{{&#8593;&#8593;}}</td><td class=\"up\">&#8593;</td><td>near baseline</td></tr><tr><td>Diastolic BP</td><td>baseline</td><td>{{&#8776; or slightly &#8595;}}</td><td>&#8776;</td><td>&#8776;</td></tr><tr><td>Pulse pressure</td><td>baseline</td><td class=\"up\">{{wide}}</td><td>narrowing</td><td>near baseline</td></tr></tbody></table></div><ul class=\"pts\"><li>Sympathetic drive raises HR, contractility, SV and CO &#8594; <b>SBP {{rises}}</b>. Metabolic dilation in muscle lowers {{TPR}} &#8594; <b>DBP stays about the same</b>. So pulse pressure widens.</li><li>Fit people recover {{faster}}. Stopping suddenly and standing still removes the {{muscle pump}} &#8594; venous return falls &#8594; post-exercise light-headedness or fainting.</li><li>Isometric, heavy lifting (with breath-holding) raises SBP <b>and</b> DBP sharply, so it is avoided in uncontrolled hypertension and coronary disease.</li></ul>"},
{"t":"tf","id":"B28","src":"Lab quiz","core":true,"q":"During exercise, both systolic blood pressure and pulse pressure increase.","a":true,"ex":"SBP rises with stroke volume and contractility while DBP stays about constant (lower TPR), so pulse pressure widens."},
{"t":"q","id":"B29","src":"AC79","q":"A fit person finishes an intense workout and stands motionless; they become light-headed and faint. The abrupt end of leg-muscle contraction causes a significant decrease in which parameter?","o":["Arterial oxygen saturation","Venous return to the heart","Muscle oxygen demand","Myocardial contractility","Cerebral metabolic rate"],"a":1,"ex":"The skeletal muscle pump had been pushing blood back to the heart through the dilated muscle beds. When it stops, blood pools in the legs, venous return and CO fall, and the brain is briefly underperfused."},
{"t":"q","id":"B30","src":"AC80","q":"A man has long-standing hypertension. Which type of exercise should be avoided?","o":["Long-distance running","Yoga","Swimming","Leg extension","Heavy weight lifting"],"a":4,"ex":"Heavy isometric lifting, often with a Valsalva, produces a large pressor response (both SBP and DBP spike). Dynamic aerobic exercise is recommended."}
]});

/* Section M: Lab: Microcirculation
   Generated by gen.js from old/micro.js + patch.js. {{text}} = cloze blank in concept cards. */
CVS.add({"id":"M","short":"Microcirculation lab","title":"Lab: Microcirculation","kind":"Lab","blurb":"Arterial and venous occlusion, reactive hyperemia, white reaction and triple response, temperature and gravity.","items":[
{"t":"c","id":"M-C1","title":"The five experiments at a glance","src":"Lab direction","html":"<div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Experiment</th><th>What you do</th><th>What you see</th><th>Why</th></tr></thead><tbody><tr><td><b>Arterial occlusion</b></td><td>Raise the arm, clench the fist, inflate the cuff to 200 mmHg for 5 min, then release</td><td>Pale, cold, pulseless, painful; after release bright red and warm</td><td>{{Ischemia, then reactive hyperemia}}</td></tr><tr><td><b>Venous occlusion</b></td><td>Cuff 30&#8211;40 mmHg, then 80&#8211;90 mmHg, 5 min each</td><td>Engorged veins, dusky bluish skin, tense fingertips, tingling</td><td>{{Outflow blocked while inflow continues}}</td></tr><tr><td><b>Skin stroking</b></td><td>Blunt object, lightly then firmly</td><td>White line; or red line &#8594; flare &#8594; wheal</td><td>{{Mechanical emptying; triple response}}</td></tr><tr><td><b>Temperature</b></td><td>Arm in water at 40&#8211;45, 20 and 5&#8211;10 &#176;C, 5 min each</td><td>Warm: red, veins full. Cold: red but veins flat, painful</td><td>{{Skin vessels serve temperature control}}</td></tr><tr><td><b>Gravity</b></td><td>One arm up, one hanging down for 1 min</td><td>Raised: pale, veins empty. Hanging: red-purple, veins full</td><td>{{Hydrostatic pressure}}</td></tr></tbody></table></div><p class=\"note\">Microcirculation = arterioles &#8594; metarterioles &#8594; precapillary sphincters &#8594; capillaries &#8594; postcapillary venules &#8594; venules, plus lymphatics. Skin of the fingers, toes, palms, soles, ears, nose and lips also has <b>{{arteriovenous anastomoses}}</b> under sympathetic control: {{open when warm, shut when cold}}.</p>"},
{"t":"c","id":"M-C2","title":"Arterial occlusion and reactive hyperemia","src":"Lab direction","html":"<div class=\"cols2\"><div class=\"mini\"><h4>During: cuff 200 mmHg, 5 min</h4><ul><li>Cuff pressure is above {{SBP}}: nothing enters and nothing leaves</li><li><b>Pale</b> (blood drained first by raising the arm and clenching the fist), <b>cold</b>, <b>no radial pulse</b></li><li><b>Pain, tingling, numbness</b>: ischemic nerves; K&#8314;, H&#8314;, lactate and bradykinin build up and excite nociceptors</li><li><b>{{No edema}}</b>: with no inflow, capillary pressure is {{low}} and nothing is filtered</li></ul></div><div class=\"mini art\"><h4>After release: reactive hyperemia</h4><ul><li>Skin flushes <b>{{bright red and warm}}</b>; flow rises several-fold</li><li>Cause: {{vasodilator metabolites}} that piled up (adenosine, K&#8314;, H&#8314;, CO&#8322;, lactate), O&#8322; lack and myogenic relaxation of the arterioles; then NO from the high flow</li><li>Oxygenated blood floods in, so <b>{{deoxyhemoglobin falls fast}}</b></li><li>It lasts roughly {{in proportion to the occlusion time}} and ends once metabolites are washed out and the O&#8322; debt is repaid</li></ul></div></div>"},
{"t":"q","id":"M1","src":"AC80","core":true,"q":"A cuff at <b>200 mmHg</b> is applied on a patient&#8217;s arm for 5 minutes. Which of the following should <b>NOT</b> be found?","o":["Pain","Edema","Cold","Lack of pulse","Pallor"],"a":1,"ex":"200 mmHg is above systolic pressure, so no blood enters: the forearm is pale, cold, pulseless and painful. With no inflow, capillary hydrostatic pressure is low and there is no filtration, so no edema."},
{"t":"q","id":"M2","src":"AC80","q":"Which is not present in the right forearm when the cuff pressure is at 200 mmHg for 5 minutes?","o":["Cold","Absent radial pulse","Pale","Edema","Pain"],"a":3,"ex":"Same principle as M1: edema needs capillary filtration, which needs blood flow in."},
{"t":"q","id":"M3","src":"AC81","core":true,"q":"Immediately after releasing a 200-mmHg pressure cuff, which physiologic change happens?","o":["Increased warm blood flow","Vasoconstriction of arterioles in the upper forearm"],"a":0,"ex":"Reactive hyperemia: the arterioles are maximally dilated by accumulated metabolites, so warm blood rushes in."},
{"t":"q","id":"M4","src":"AC79","core":true,"q":"Which describes a key physiological event during reactive hyperemia after release of a tourniquet?","o":["A sustained decrease in capillary permeability, preventing fluid extravasation","Significant accumulation of vasoconstrictive metabolites in the interstitial fluid","A rapid and marked decrease in deoxyhemoglobin levels in the affected tissues","Decreased nitric oxide production, leading to localized vasoconstriction","Enhanced oxygen extraction by tissues due to reduced metabolic demand"],"a":2,"ex":"Oxygenated blood floods the dilated vessels, so deoxyhemoglobin falls quickly and the skin turns bright red. The metabolites are vasodilators, NO rises with the high flow, and demand has not fallen."},
{"t":"q","id":"M5","src":"AC78","q":"After inflating and releasing a blood pressure cuff, reactive hyperemia occurs. What is the primary physiological response?","o":["Nociceptor C-fiber activation","Serotonin release from platelets","Depletion of tissue metabolites","Decrease of deoxyhemoglobin","Inhibition of bradykinin"],"a":3,"ex":"Same as M4. Metabolites that piled up during occlusion <b>cause</b> the dilation; their washout is what ends the hyperemia."},
{"t":"c","id":"M-C3","title":"Venous occlusion","src":"Lab direction","html":"<div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th></th><th>Cuff 30&#8211;40 mmHg</th><th>Cuff 80&#8211;90 mmHg</th></tr></thead><tbody><tr><td>Flow</td><td>Above venous pressure, far below DBP: {{arterial inflow continues, venous outflow blocked}}</td><td>About DBP: {{inflow only at the systolic peaks}}, outflow blocked</td></tr><tr><td>Veins</td><td>Distended, engorged</td><td>More engorged</td></tr><tr><td>Skin and fingertips</td><td>Reddish-purple, warm, tense fingertips</td><td>{{Dusky blue (cyanotic)}}, pulp swollen; petechiae may appear</td></tr><tr><td>Feeling</td><td>Fullness, mild tingling</td><td>Tingling, pain (stagnant hypoxia)</td></tr><tr><td>Pulse</td><td>Present</td><td>Weaker</td></tr></tbody></table></div><ul class=\"pts\"><li>Raised venous pressure raises capillary hydrostatic pressure &#8594; more filtration &#8594; swelling.</li><li>The veins distend <b>{{passively}}</b>. Arterioles do not dilate; a rise in venous pressure triggers a local {{veno-arteriolar constriction}} that limits capillary pressure.</li><li>The {{tourniquet test}} for dengue uses the same idea: cuff {{between SBP and DBP}} for 5 min, then count petechiae.</li></ul>"},
{"t":"q","id":"M6","src":"AC77","core":true,"q":"An arm cuff pressure of <b>80 mmHg</b> is applied to the forearm. Which response is <b>least</b> likely to occur?","o":["Stimulation of nociceptors","Elevated venous pressure","Hypoxia","Dysesthesia","Vasodilation"],"a":4,"ex":"80 mmHg is above venous pressure but below systolic: blood gets in but cannot get out. Venous pressure rises, the tissue becomes congested and hypoxic, nociceptors fire and the arm tingles. The veins stretch passively, but this is not vasodilation."},
{"t":"c","id":"M-C4","title":"Stroking the skin: white reaction and triple response","src":"Lab direction","html":"<div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Response</th><th>Stimulus and timing</th><th>Mechanism</th></tr></thead><tbody><tr><td><b>White reaction</b></td><td>Light stroke &#183; pale line within ~15&#8211;20 s</td><td>Blood pressed out of superficial capillaries and venules (<b>{{mechanical expulsion}}</b>), with contraction of precapillary sphincters</td></tr><tr><td><b>1 &#183; Red line</b></td><td>Firm stroke &#183; 3&#8211;15 s, exactly on the line</td><td>Direct local dilation of the small vessels ({{local histamine from mast cells}})</td></tr><tr><td><b>2 &#183; Flare</b></td><td>15&#8211;30 s &#183; spreads 1&#8211;2 cm around the line</td><td><b>{{Axon reflex}}</b>: impulses in the sensory C fiber run back down its other branches (antidromic) and release {{substance P and CGRP}} &#8594; arteriolar dilation. Not a spinal reflex: it {{survives spinal cord section}} but is abolished by {{local anesthesia}} or degeneration of the sensory nerve</td></tr><tr><td><b>3 &#183; Wheal</b></td><td>1&#8211;3 min &#183; raised swelling on the line</td><td>{{&#8593;permeability of capillaries and postcapillary venules (histamine)}} &#8594; local edema</td></tr></tbody></table></div><p class=\"note\">Insect bites and bee stings use the same mediators (histamine, bradykinin): redness, swelling and pain come mainly from increased capillary permeability.</p>"},
{"t":"q","id":"M7","src":"AC78","core":true,"q":"Skin capillaries are emptied by a light stroke with a blunt object. What is the phenomenon?","o":["White reaction","Axon reflex","Triple response","Red reaction","Flare"],"a":0,"ex":"A light stroke gives the white reaction: a pale line as blood is squeezed out of the superficial vessels."},
{"t":"q","id":"M8","src":"AC81","q":"What happens when the skin is <b>gently</b> scratched by a blunt object?","o":["Decreased tissue oxygen concentration","Local histamine release","Increased capillary permeability","Antidromic conduction via C fibers","Mechanical expulsion of blood"],"a":4,"ex":"Gentle = white reaction = mechanical expulsion of blood from capillaries and venules. Histamine, permeability and the C-fiber axon reflex need a firmer stroke."},
{"t":"q","id":"M9","src":"AC80","core":true,"q":"When an object is <b>firmly</b> dragged on the skin, what causes the redness in the <b>surrounding</b> area?","o":["Inhibition of histamine","Increased capillary permeability","Vasoconstriction","Antidromic impulses in C fibers"],"a":3,"ex":"The spreading redness around the line is the flare: an axon reflex in which C-fiber impulses travel antidromically and release vasodilator peptides."},
{"t":"q","id":"M10","src":"AC77","flag":"Option e was recalled as &#8220;axon synapse&#8221;; the mechanism is the axon reflex.","q":"What is the mechanism behind the <b>flare</b> after a stroke to the skin?","o":["Increased permeability of capillaries","Reflex via the spinal cord","Mechanical expulsion","Keratinocyte dissociation","Axon reflex (recalled as &#8220;axon synapse&#8221;)"],"a":4,"ex":"The flare depends only on the sensory nerve&#8217;s own branches. It persists after spinal section, so it is not a spinal reflex."},
{"t":"q","id":"M11","src":"AC79","flag":"Ambiguous recall. If the stem meant the flare, the answer is B (axon reflex).","q":"Triple response: the <b>red</b> (line) เกิดจาก <span class=\"muted\">(is caused by)</span>","o":["Increased permeability of capillaries","Axon reflex","Dilated vessels at the site","Mechanical (as in the white reaction)"],"a":2,"ex":"Red line = direct local dilation where the skin was stroked. Flare = spreading arteriolar dilation through the axon reflex. Wheal = increased permeability. White line = mechanical emptying."},
{"t":"q","id":"M12","src":"AC80","core":true,"q":"A girl is stung by a bee and develops localized swelling, redness and pain at the site. What is the primary cause of these symptoms?","o":["Increased water and sodium retention","Increased capillary hydrostatic pressure","Increased capillary permeability","Increased arteriolar constriction","Increased capillary osmotic pressure"],"a":2,"ex":"Venom and mast-cell mediators (histamine, bradykinin) dilate arterioles and make capillaries and venules leaky: protein-rich fluid leaks out, giving a local wheal."},
{"t":"q","id":"M13","src":"AC76","q":"โดน insect bite แล้วมี swelling จากนั้นมี edema ถามว่า edema เกิดจากอะไร <span class=\"muted\">(Insect bite &#8594; swelling &#8594; edema. Cause?)</span>","o":["Increased intravascular hydrostatic pressure","Increased interstitial hydrostatic pressure","Decreased lymphatic drainage","Decreased interstitial oncotic pressure","Increased capillary permeability"],"a":4,"ex":"Inflammatory mediators open gaps between endothelial cells, so plasma protein and fluid escape."},
{"t":"c","id":"M-C5","title":"Warm and cold water","src":"Lab direction","html":"<div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Water</th><th>Skin color</th><th>Superficial veins</th><th>Why</th></tr></thead><tbody><tr><td class=\"num\">40&#8211;45 &#176;C</td><td>Red, warm</td><td><b>{{Engorged}}</b></td><td>Local warming and less sympathetic tone dilate arterioles, veins and {{AV shunts}} to lose heat</td></tr><tr><td class=\"num\">20 &#176;C</td><td>Slightly pale</td><td>Less prominent</td><td>Mild vasoconstriction</td></tr><tr><td class=\"num\">5&#8211;10 &#176;C</td><td><b>{{Red}}</b> (and painful)</td><td><b>{{Flattened}}</b></td><td>Cold constricts veins and arterioles (sympathetic plus cold-sensitized &#945;-receptors). The skin still looks red because cold hemoglobin holds on to O&#8322; ({{left shift}}), so skin blood stays oxygenated, and below ~10&#8211;15 &#176;C {{cold-induced vasodilation (hunting reaction)}} opens vessels in waves</td></tr></tbody></table></div><p class=\"note\">The changes stay in the immersed arm; the other arm is the control.</p>"},
{"t":"q","id":"M14","src":"AC76","core":true,"q":"What is most likely observed after soaking the left arm in cold, <b>5 &#176;C</b> water for 5 minutes?","o":["Red and engorged superficial veins: both arms","Red and engorged superficial veins: left arm","Red and flattened superficial veins: left arm","Pale and engorged superficial veins: left arm","Pale and flattened superficial veins: left arm"],"a":2,"ex":"Very cold water flattens the superficial veins (venoconstriction) but the skin looks red: oxygen stays bound to cold hemoglobin and cold-induced vasodilation comes in waves. Only the immersed arm changes."},
{"t":"q","id":"M15","src":"AC79","q":"A hand is immersed in ice water for 5 minutes. Which is <b>incorrect</b> regarding the test hand?","o":["Engorged superficial veins","Decreased palm skin temperature","Increased skin blood flow","Increased arteriolar vasoconstrictor tone","Skin redness"],"a":0,"ex":"Cold flattens superficial veins. The other statements fit: the palm cools, vasoconstrictor tone rises, the skin is red, and cold-induced vasodilation gives bursts of increased skin flow."},
{"t":"c","id":"M-C6","title":"Gravity and venous pressure","src":"Lab direction","html":"<div class=\"cols2\"><div class=\"mini\"><h4>Arm raised above the head</h4><p>{{Pale}}; veins empty and collapse. Hydrostatic pressure falls, blood drains toward the heart. Collapsible veins cannot hold a negative pressure, so hand venous pressure sits {{near zero}}.</p></div><div class=\"mini ven\"><h4>Arm hanging down</h4><p>{{Red-purple}}; veins engorged. Hydrostatic pressure adds to venous and capillary pressure (more filtration).</p></div></div><ul class=\"pts\"><li>Standing quietly: foot veins {{~ +90 mmHg}}; neck veins collapse (~0); <b>dural venous sinuses</b> sit inside the rigid skull and cannot collapse, so their pressure is <b>{{negative}}</b> (~ {{&#8722;10 mmHg}}). This is why {{air embolism}} is a risk in sitting-position neurosurgery.</li><li>Inspiration lowers intrathoracic pressure, so venous pressure in the great thoracic veins <b>{{falls}}</b> and venous return rises.</li></ul>"},
{"t":"q","id":"M16","src":"AC79","core":true,"q":"In an adult standing quietly at rest, which statement about venous pressure is <b>TRUE</b>?","o":["Pressure in the venous sinuses in the skull is negative","When the hand is raised above the head, venous pressure in the hand becomes negative","Venous pressure in the feet is negative due to gravity","When the hand is raised above the head, venous pressure in the hand becomes positive","Venous pressure in the great veins of the thorax increases during inspiration"],"a":0,"ex":"The skull holds the dural sinuses open, so hydrostatic suction makes their pressure negative. Raised hand veins collapse at about zero; foot veins are strongly positive; inspiration lowers thoracic venous pressure."}
]});

/* Section P: Lab: Physical Examination of the CVS
   Generated by gen.js from old/pe.js + patch.js. {{text}} = cloze blank in concept cards. */
CVS.add({"id":"P","short":"Heart exam lab","title":"Lab: Physical Examination of the CVS","kind":"Lab","blurb":"Inspection, palpation, percussion and auscultation; heart sounds, murmurs, pulses and the jugular venous pulse.","items":[
{"t":"c","id":"P-C1","title":"What each step of the exam can and cannot tell you","html":"<figure class=\"scan wide\"><div class=\"paperimg\"><img src=\"img/pe-palpation.png\" width=\"1000\" height=\"331\" alt=\"Fig 1: palpating the apex and the base of the heart.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 1: palpating the apex and the base of the heart. <span class=\"src\">PE lab manual, Fig 1</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Step</th><th>Look for</th><th>Exam traps</th></tr></thead><tbody><tr><td><b>Inspection</b></td><td>Cyanosis, edema, breathlessness, JVP, visible apex</td><td>Cyanosis and edema may <b>not</b> be cardiac: {{lung disease, nephrotic syndrome, liver disease}}, venous or lymphatic obstruction</td></tr><tr><td><b>Palpation</b></td><td>Apex beat (PMI): left <b>{{5th ICS, midclavicular line}}</b>. Displaced = {{LV dilation}}; sustained heave = {{LV hypertrophy}}; parasternal heave = {{RV hypertrophy}}; thrills</td><td>Palpation detects {{ventricular}}, not atrial, enlargement. The PMI is at the MCL, not the mid-axillary line</td></tr><tr><td><b>Percussion</b></td><td>Area of cardiac dullness</td><td>{{Of little value}}; it cannot diagnose constrictive pericarditis</td></tr><tr><td><b>Auscultation</b></td><td>Diaphragm: <b>{{high}}</b>-pitched (S1, S2, AR, MR, rubs). Bell, held lightly: <b>{{low}}</b>-pitched (S3, S4, MS rumble)</td><td>A murmur is not always disease (innocent flow murmurs)</td></tr></tbody></table></div><p class=\"note\">Heart-failure signs by side: <b>left</b> (backward into the lungs) = {{dyspnea, orthopnea, PND, crackles}}. <b>Right</b> (backward into systemic veins) = {{raised JVP, hepatojugular reflux, hepatomegaly, ankle and sacral edema}}.</p>"},
{"t":"q","id":"P1","src":"AC79","core":true,"q":"ข้อไหนถูกต้องเกี่ยวกับการตรวจหัวใจ <span class=\"muted\">(Which is correct about heart examination?)</span>","o":["Palpation can detect atrial hypertrophy","Percussion can detect constrictive pericarditis","The diaphragm is used for high-pitched sounds","Cyanosis and edema mean heart failure"],"a":2,"ex":"Diaphragm = high pitch; bell = low pitch. Palpation finds ventricular (not atrial) enlargement, percussion cannot diagnose constrictive pericarditis, and cyanosis or edema have many non-cardiac causes."},
{"t":"q","id":"P2","src":"AC76","q":"Which is correct about heart examination?","o":["Palpation can be used to diagnose atrial hypertrophy","Percussion can be used to diagnose constrictive pericarditis","Edema and cyanosis might not be the direct effect of heart disorders","The bell of the stethoscope is used for high-pitched sounds"],"a":2,"ex":"Edema and cyanosis can come from the lungs, kidneys, liver, veins or lymphatics. The bell is for low-pitched sounds."},
{"t":"q","id":"P3","src":"AC77","flag":"A and C are both true as recalled; the real exam probably worded one of them differently.","q":"Which is correct about heart examination?","o":["Palpation can detect right ventricular hypertrophy","Percussion can detect constrictive pericarditis","The diaphragm of the stethoscope is used for high-pitched sounds","Cyanosis always indicates heart disease","The PMI is at the 5th ICS and mid-axillary line"],"a":[0,2],"ex":"A parasternal heave (felt with the heel of the hand at the left sternal edge) means RVH, and the diaphragm picks up high-pitched sounds. The PMI lies at the 5th ICS, midclavicular line."},
{"t":"q","id":"P4","src":"AC75&#8211;79","q":"Which of the following is true regarding the physical examination of the heart?","o":["Cyanosis and edema may not be the result of heart failure","A heart murmur always indicates severe valvular disease","Jugular venous distension is a sign of left-sided heart failure","Hepatojugular reflux is a sign of decreased cardiac output","Orthopnea is a sign of right-sided heart failure"],"a":0,"ex":"B: innocent murmurs exist. C: JVD reflects raised right-sided (RA) pressure. D: hepatojugular reflux shows that the right heart cannot take extra volume (raised RA pressure). E: orthopnea is pulmonary congestion, a left-sided sign."},
{"t":"q","id":"P5","src":"AC80","core":true,"q":"A medical student examines her father, who has essential hypertension. His PMI is 1 cm lateral to the midclavicular line in the 5th ICS. What is the pathophysiology of hypertension here?","o":["Atrial fibrillation","Increased afterload","Increased preload","Increased cardiac output","Increased stroke volume"],"a":1,"ex":"High arterial pressure is a pressure load (afterload) on the LV. The LV hypertrophies and later enlarges, moving the apex beat outward."},
{"t":"c","id":"P-C2","title":"Heart sounds on the cardiac cycle","html":"<div class=\"cycle\"><div class=\"ph\">Atrial systole<span>{{S4}} if the LV is stiff &#183; JVP <b>{{a}}</b></span></div><div class=\"sd\">S1</div><div class=\"ph\">Isovolumetric contraction<span>all valves shut &#183; JVP <b>{{c}}</b></span></div><div class=\"ph\">Ejection, rapid &#8594; reduced<span>carotid pulse &#183; systolic murmurs &#183; JVP <b>{{x}}</b></span></div><div class=\"sd\">S2</div><div class=\"ph\">Isovolumetric relaxation<span>all valves shut &#183; JVP <b>{{v}}</b> peak</span></div><div class=\"ph\">Rapid filling<span>{{S3}} &#183; JVP <b>{{y}}</b></span></div><div class=\"ph\">Diastasis<span>slow filling</span></div></div><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Sound</th><th>Cause</th><th>Timing</th><th>Clinical point</th></tr></thead><tbody><tr><td><b>S1</b></td><td>{{Mitral + tricuspid close}}</td><td>Between atrial systole and isovolumetric contraction</td><td>Just before the carotid upstroke; the radial pulse is later. Loud in MS</td></tr><tr><td><b>S2</b></td><td>{{Aortic + pulmonic close}}</td><td>Between ejection and isovolumetric relaxation</td><td>Splits on inspiration (P2 later). Wide fixed split = {{ASD}}</td></tr><tr><td><b>S3</b></td><td>{{Rapid ventricular filling}}</td><td>Early diastole, just after S2</td><td>Normal in the young and in pregnancy; heart failure or volume overload in adults</td></tr><tr><td><b>S4</b></td><td>{{Atrium contracting into a stiff ventricle}}</td><td>Late diastole, just before S1</td><td>LVH, hypertension, ischemia; absent in {{AF}}</td></tr></tbody></table></div>"},
{"t":"q","id":"P6","src":"AC75","core":true,"flag":"Only two options were recalled.","q":"Regarding the first heart sound (S1), which of the following events occurs?","o":["S1 occurs simultaneously with the radial pulse","S1 occurs when the mitral and tricuspid valves close"],"a":1,"ex":"S1 is AV-valve closure. The radial pulse arrives noticeably after S1, because the pulse wave takes time to reach the wrist."},
{"t":"q","id":"P7","src":"AC76","core":true,"q":"Which phase occurs just after the <b>first</b> heart sound?","o":["Ventricular ejection","Isovolumic relaxation","Isovolumic contraction","Atrial systole","Late diastole"],"a":2,"ex":"After the AV valves close, pressure builds with every valve shut until the semilunar valves open."},
{"t":"q","id":"P8","src":"AC76","core":true,"q":"Which phase occurs just after the <b>second</b> heart sound?","o":["Late diastole","Atrial systole","Isovolumetric contraction","Isovolumetric relaxation","Ventricular ejection"],"a":3,"ex":"After the semilunar valves close, ventricular pressure falls with every valve shut until the AV valves open."},
{"t":"q","id":"P9","src":"AC77","q":"Which of the following occurs right before the second heart sound?","o":["Atrial contraction","Ventricular contraction","Ventricular ejection","Ventricular filling","Isovolumic relaxation"],"a":2,"ex":"S2 marks the end of ejection (reduced ejection phase). Isovolumic relaxation comes after it."},
{"t":"q","id":"P10","src":"AC79","q":"S1 signifies closure of the AV valves. This event occurs at the transition between which two phases of the cardiac cycle?","o":["Isovolumetric contraction and rapid ejection","Atrial systole and isovolumetric contraction","Rapid ejection and reduced ejection","Isovolumetric relaxation and rapid ventricular filling","Rapid ventricular filling and atrial systole"],"a":1,"ex":"Atrial systole finishes ventricular filling, the ventricle starts to contract, the AV valves shut (S1) and isovolumetric contraction begins."},
{"t":"q","id":"P11","src":"AC80","flag":"Recall uncertain. If the stem meant an extra sound before S1 (S4), its cause would be atrial contraction, which is not offered.","q":"An abnormal heart sound (unlikely a murmur) is heard just before the carotid pulse. What might cause the sound?","o":["Rapid ventricular filling","Ventricular ejection","Atrioventricular valves open","Atrioventricular valves close","Semilunar valves close"],"a":3,"ex":"The carotid upstroke comes a moment after S1, so the sound just before it is S1 (AV-valve closure), which is abnormally loud in mitral stenosis. Rapid filling (S3) and semilunar closure (S2) come after the pulse."},
{"t":"c","id":"P-C3","title":"Where to listen and what the murmur looks like","html":"<div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/pe-areas.png\" width=\"1240\" height=\"551\" alt=\"Classic auscultation areas: P pulmonary, A aortic, M mitral, T tricuspid.\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Classic auscultation areas: P pulmonary, A aortic, M mitral, T tricuspid. <span class=\"src\">PE lab manual</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Area</th><th>Site</th><th>Typical murmurs</th></tr></thead><tbody><tr><td><b>A</b> aortic</td><td>{{Right 2nd ICS}}, parasternal</td><td>AS (ejection systolic, to the carotids); AR</td></tr><tr><td><b>P</b> pulmonic</td><td>{{Left 2nd ICS}}, parasternal</td><td>PS (ejection systolic); PR (early diastolic)</td></tr><tr><td><b>E</b> Erb&#8217;s point</td><td>{{Left 3rd ICS}}</td><td>AR is often loudest here</td></tr><tr><td><b>T</b> tricuspid</td><td>{{Left lower sternal border}}, 4th&#8211;5th ICS</td><td>TR (pansystolic, louder on inspiration); TS (diastolic); VSD</td></tr><tr><td><b>M</b> mitral (apex, PMI)</td><td>{{Left 5th ICS, midclavicular line}}</td><td>MR (pansystolic, to the axilla); MS (mid-diastolic rumble, bell, left lateral position)</td></tr></tbody></table></div></div><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Lesion</th><th>Timing and shape</th><th>Where, and what makes it louder</th></tr></thead><tbody><tr><td><b>AS</b> / PS</td><td>{{Ejection systolic}}: crescendo&#8211;decrescendo, starts after S1</td><td>Aortic area, radiates to the {{carotids}} (PS: pulmonic area)</td></tr><tr><td><b>MR</b> / TR</td><td>{{Pansystolic}}: flat, S1 to S2</td><td>Apex, radiates to the {{axilla}} (TR: lower left sternal border, louder on {{inspiration}})</td></tr><tr><td><b>AR</b> / PR</td><td>{{Early diastolic}}: decrescendo, blowing, starts at S2</td><td>Erb&#8217;s point or right 2nd ICS, patient sitting forward, breath held out</td></tr><tr><td><b>MS</b></td><td>{{Mid-diastolic rumble}} after an opening snap</td><td>Apex with the {{bell}}, left lateral position</td></tr></tbody></table></div><p class=\"note\">Two questions solve most murmur items: <b>when</b> is it (with the carotid pulse = {{systolic}}; after S2 = {{diastolic}}) and <b>where</b> is it loudest (the area names the valve). The exam uses the classic areas strictly: left 2nd ICS = {{pulmonic}}.</p>"},
{"t":"q","id":"P12","src":"AC81","core":true,"q":"A patient has fatigue on exertion. A <b>diastolic</b> murmur is heard best at the <b>left 2nd ICS</b> beside the sternum. What is the most likely diagnosis?","o":["Aortic stenosis","Mitral stenosis","Aortic regurgitation","Mitral regurgitation","Pulmonary regurgitation"],"a":4,"ex":"Diastolic + pulmonic area = pulmonary regurgitation (early diastolic, decrescendo). AR is classically at the right 2nd ICS or Erb&#8217;s point."},
{"t":"q","id":"P13","src":"AC75","q":"On examination, a diastolic blowing murmur is clearest at the left second intercostal space of the sternum. What is it?","o":["Aortic stenosis","Aortic regurgitation","Pulmonary stenosis","Pulmonary regurgitation","Tricuspid stenosis"],"a":3,"ex":"Same reasoning as P12: diastolic blowing murmur at the pulmonic area."},
{"t":"q","id":"P14","src":"AC77","core":true,"q":"ตรวจพบ systolic ejection murmur ที่ left sternal border of 2nd ICS <span class=\"muted\">(Systolic ejection murmur at the left sternal border, 2nd ICS.)</span>","o":["Aortic regurgitation","Aortic stenosis","Pulmonary regurgitation","Pulmonary stenosis","Mitral regurgitation"],"a":3,"ex":"Systolic ejection + pulmonic area = pulmonary stenosis. AS would be loudest at the right 2nd ICS and radiate to the carotids."},
{"t":"q","id":"P15","src":"AC81","q":"A patient has chest discomfort. A murmur is heard at the <b>left 2nd ICS</b>, simultaneous with the carotid pulse. Most likely diagnosis?","o":["Pulmonary stenosis","Pulmonary regurgitation","Mitral stenosis","Mitral regurgitation","Aortic stenosis"],"a":0,"ex":"With the carotid pulse = systolic. Left 2nd ICS = pulmonic area. So pulmonary stenosis."},
{"t":"q","id":"P16","src":"AC76","core":true,"q":"Which condition causes a diastolic rumbling murmur at the PMI?","o":["Mitral regurgitation","Mitral stenosis","Tricuspid regurgitation","Aortic regurgitation","Coarctation of aorta"],"a":1,"ex":"Blood forced through a narrow mitral valve during diastole gives a low-pitched rumble at the apex (bell, left lateral position), often after an opening snap."},
{"t":"q","id":"P17","src":"AC78","core":true,"q":"A patient presents with a pansystolic murmur heard at the point of maximal impulse. Most likely diagnosis?","o":["Aortic stenosis","Pulmonary regurgitation","Tricuspid regurgitation","Tricuspid stenosis","Mitral regurgitation"],"a":4,"ex":"Pansystolic + apex = mitral regurgitation, radiating to the axilla."},
{"t":"q","id":"P18","src":"AC80","core":true,"q":"A patient has fatigue and chest discomfort. A diastolic murmur is best heard at the <b>left 5th ICS, parasternal border</b>. Most likely diagnosis?","o":["Tricuspid stenosis","Mitral regurgitation","Pulmonic stenosis","Aortic regurgitation","Tricuspid regurgitation"],"a":0,"ex":"Left lower sternal border = tricuspid area; diastolic = stenosis of an AV valve. So tricuspid stenosis."},
{"t":"q","id":"P19","src":"AC77","flag":"Ambiguous recall. If the stem said left upper (2nd ICS) parasternal, the answer would be pulmonary stenosis (D).","q":"Physical examination reveals a systolic murmur at the left parasternal border. Which pathology fits this finding?","o":["Mitral valve regurgitation","Mitral valve stenosis","Tricuspid valve regurgitation","Pulmonary valve stenosis","Aortic valve stenosis"],"a":2,"ex":"Without an ICS given, the left (lower) sternal border is the tricuspid area, and a systolic murmur there is tricuspid regurgitation (pansystolic, louder on inspiration)."},
{"t":"c","id":"P-C4","title":"Feeling the pulse","html":"<div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/pe-carotid.jpg\" width=\"1480\" height=\"848\" alt=\"Fig 2: palpating the carotid artery (Bates&#8217; Guide to Physical Examination, 13th ed., as cited in the manual).\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Fig 2: palpating the carotid artery (Bates&#8217; Guide to Physical Examination, 13th ed., as cited in the manual). <span class=\"src\">PE lab manual, Fig 2</span></figcaption></figure><div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>Pulse</th><th>What you feel</th><th>Cause</th></tr></thead><tbody><tr><td><b>Collapsing</b> (water-hammer)</td><td>Sharp rise, sudden fall; wide pulse pressure, low DBP</td><td>{{Aortic regurgitation}}</td></tr><tr><td><b>Pulsus parvus et tardus</b></td><td>Small, late-peaking, delayed carotid pulse; narrow pulse pressure</td><td>{{Aortic stenosis}}</td></tr><tr><td><b>Pulsus paradoxus</b></td><td>SBP falls more than {{10 mmHg}} on inspiration</td><td>{{Cardiac tamponade}} (also severe asthma, constriction)</td></tr><tr><td><b>Pulse deficit</b></td><td>Apical rate higher than radial rate</td><td>{{Atrial fibrillation}}: short beats never reach the wrist</td></tr><tr><td><b>Pulsus alternans</b></td><td>Strong and weak beats alternate</td><td>{{Severe LV failure}}</td></tr><tr><td>Stiff arteries</td><td>Fast pulse wave, high SBP, wide pulse pressure</td><td>{{Aging, atherosclerosis}}</td></tr></tbody></table></div></div><p class=\"note\">Tamponade: Beck&#8217;s triad = {{hypotension, raised JVP, muffled heart sounds}}, plus tachycardia and narrow pulse pressure.</p>"},
{"t":"q","id":"P20","src":"AC76","core":true,"q":"Which of the following can be observed in aortic regurgitation?","o":["Collapsing pulse","Plateau pulse","Pulsus paradoxus","Weak pulse","Pulse deficit"],"a":0,"ex":"A large stroke volume gives a sharp upstroke and high SBP, and the backflow into the LV makes the pressure collapse in diastole."},
{"t":"q","id":"P21","src":"AC77","flag":"Assumes the murmur is aortic (right 2nd ICS); pulmonary regurgitation has no characteristic pulse.","q":"A patient has a diastolic murmur at the 2nd intercostal space, parasternal border. What can be found?","o":["Collapsing pulse","Plateau pulse","Pulsus paradoxus","Pulsus parvus","Pulsus tardus"],"a":0,"ex":"A diastolic murmur at the aortic area is AR, which gives a collapsing pulse. Plateau, parvus and tardus belong to AS."},
{"t":"q","id":"P22","src":"AC80","core":true,"q":"A patient has aortic stenosis. Which would be found on examination?","o":["Delayed carotid pulse","Pulsus paradoxus","Collapsing pulse"],"a":0,"ex":"The LV pushes blood through a narrow valve, so the pulse rises slowly and peaks late (pulsus parvus et tardus)."},
{"t":"q","id":"P23","src":"AC78","core":true,"q":"Which of the following is a classic sign of cardiac tamponade?","o":["Pulsus paradoxus","Increased stroke volume","Left-sided heart failure","Widened pulse pressure","Bradycardia"],"a":0,"ex":"With a fixed pericardial space, the inspiratory increase in right-heart filling pushes the septum left and shrinks LV filling, so SBP falls by more than 10 mmHg on inspiration. SV falls, pulse pressure narrows, HR rises."},
{"t":"q","id":"P24","src":"AC81","q":"A patient with chest pain, dizziness and dyspnea is diagnosed with massive pericardial effusion. What pulse can be seen?","o":["Pulsus paradoxus","Collapsing pulse","Pulsus parvus et tardus","Pulse deficit","Pulsus alternans"],"a":0,"ex":"Massive effusion = tamponade physiology = pulsus paradoxus."},
{"t":"c","id":"P-C5","title":"Jugular venous pulse","html":"<div class=\"two\"><figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/pe-jvp.jpg\" width=\"1560\" height=\"806\" alt=\"Measuring the JVP: vertical height of the pulsation above the sternal angle (Assavapokee &amp; Thadanipon, N Engl J Med 2020, as cited in the manual).\" loading=\"lazy\" decoding=\"async\"></div><figcaption>Measuring the JVP: vertical height of the pulsation above the sternal angle (Assavapokee &amp; Thadanipon, N Engl J Med 2020, as cited in the manual). <span class=\"src\">PE lab manual</span></figcaption></figure><div class=\"mini\"><h4>How to look</h4><ul><li>Patient at {{45&#176;}}, head turned slightly left; watch the {{right internal jugular vein}} (straight, valveless line to the RA)</li><li>Height of the pulsation above the {{sternal angle}} (+5 cm &#8776; RA pressure). Normal &#8804; {{3&#8211;4 cm}}</li><li>Venous, not arterial: {{two peaks per beat}}, not palpable, can be occluded, falls with inspiration, rises with abdominal pressure ({{hepatojugular reflux}})</li></ul></div></div><div class=\"mini\"><h4>The waves</h4><ul><li><b>a</b> = {{RA contraction}}. Absent in {{AF}}; cannon a waves in {{AV dissociation}} (complete heart block)</li><li><b>c</b> = {{tricuspid valve bulging into the RA}} as the RV contracts</li><li><b>x</b> = {{atrial relaxation}}, tricuspid ring pulled down during ejection</li><li><b>v</b> = {{RA filling}} with the tricuspid valve shut. Giant v (cv) in {{TR}}</li><li><b>y</b> = {{tricuspid opens, RA empties into the RV}}</li></ul></div>"},
{"t":"q","id":"P25","src":"AC81","core":true,"q":"In physical examination, what is the best vein to measure jugular venous pressure?","o":["Right internal jugular vein","Left internal jugular vein","Right external jugular vein","Left external jugular vein","Superior vena cava"],"a":0,"ex":"The right IJV runs in a straight, valveless line through the SVC into the RA, so its column reflects RA pressure. External jugulars have valves and kink easily; the left side takes a longer route."},
{"t":"open","id":"P26","src":"AC81","q":"In patients with increased RA pressure, which examination can show it?","ans":"Inspect the jugular venous pressure: a raised JVP (pulsation more than 3&#8211;4 cm above the sternal angle at 45&#176;) and a positive hepatojugular reflux (sustained rise with pressure over the liver)."},
{"t":"q","id":"P27","src":"AC76","core":true,"q":"a wave ของ jugular venous pulse เกิดจากอะไร <span class=\"muted\">(The a wave of the JVP is caused by?)</span>","o":["Atrial contraction","Atrial filling","Opening of tricuspid valve","Ventricular systole","Passive emptying of the atrium"],"a":0,"ex":"The a wave is the pressure rise from RA contraction at the end of diastole."},
{"t":"q","id":"P28","src":"AC79","q":"The &#8220;A&#8221; wave of venous pulsation in the neck correlates with which event?","o":["Ventricular systole","Atrial systole","Atrial relaxation","Atrial filling","Tricuspid valve closure"],"a":1,"ex":"Atrial systole. Atrial relaxation is the x descent and atrial filling is the v wave."},
{"t":"q","id":"P29","src":"AC80","flag":"In the recalled figure the arrow lands at the foot of the wave rather than its peak. The label a and the options point to the a wave.","q":"The jugular venous pulse of a patient is shown below. What happens at point <b>a</b>?","fig":"<figure class=\"scan\"><div class=\"paperimg\"><img src=\"img/ac80-jvp.png\" width=\"1248\" height=\"621\" alt=\"AC80 exam figure\" loading=\"lazy\" decoding=\"async\"></div><figcaption class=\"srconly\"><span class=\"src\">AC80 exam figure</span></figcaption></figure>","o":["RA contracts","RA relaxes","RA fills","RV contracts"],"a":0,"ex":"a = RA contraction; x = RA relaxation; v = RA filling; c = RV contraction pushing the tricuspid valve up."},
{"t":"q","id":"P30","src":"AC80","core":true,"q":"A patient has been diagnosed with atrial fibrillation. Which wave of the jugular venous pulse should be absent?","o":["a","c","x","v","y"],"a":0,"ex":"In AF the atria only quiver, so there is no coordinated atrial contraction and no a wave (and no S4)."},
{"t":"q","id":"P31","src":"AC81","q":"Which condition results in the absence of the &#8220;a&#8221; wave of the jugular pulse?","o":["Atrial fibrillation","Sinus tachycardia","Sinus bradycardia","Sinus arrhythmia"],"a":0,"ex":"All sinus rhythms keep atrial contraction; only AF loses it."},
{"t":"q","id":"P32","src":"AC76","core":true,"q":"A 56-year-old man with right heart failure has a pansystolic murmur that increases with inspiration, loudest at the left lower sternal border. What JVP abnormality is expected?","o":["Elevated V wave","Exaggerated X wave","Cannon A wave","Absent A wave","Elevated A wave"],"a":0,"ex":"The murmur is tricuspid regurgitation: blood jets back into the RA during ventricular systole, producing a giant v (cv) wave and filling in the x descent."},
{"t":"c","id":"P-C6","title":"Breathing, S2 splitting and the ASD","html":"<ul class=\"pts\"><li><b>Normal inspiration</b>: intrathoracic pressure falls &#8594; more venous return to the right heart &#8594; RV ejects a little longer &#8594; P2 comes {{later}} &#8594; S2 splits. {{Deep inspiration}} is the strongest quick boost to venous return.</li><li><b>ASD</b>: blood shunts LA &#8594; RA all the time, so the RV always carries extra volume and P2 is always late (<b>{{wide}}</b> split).</li><li>On inspiration the extra systemic venous return raises RA pressure, so the <b>LA &#8594; RA shunt {{shrinks}}</b>. RV volume stays about the same in both phases, so the split is <b>{{fixed}}</b>.</li><li>So the parameter that <b>decreases</b> on inspiration in ASD is the {{shunt volume}}; RA preload and venous return increase.</li></ul>"},
{"t":"q","id":"P33","src":"AC78","core":true,"q":"A 25-year-old woman has dyspnea and fatigue on exertion and a widely split S2. She is diagnosed with an atrial septal defect. What <b>decreases</b> during inspiration?","o":["RA preload","LA preload","Venous return","LA&#8211;RA shunt volume","Systemic vascular resistance"],"a":3,"ex":"Inspiration raises systemic venous return and RA pressure, which cuts the pressure gradient from LA to RA, so less blood crosses the defect."},
{"t":"q","id":"P34","src":"AC78","q":"A patient has a wide, split S2 and an ASD without other abnormality. Which parameter is decreased on inspiration compared with expiration?","o":["LV preload","RV preload","Venous return","LV ejection fraction","LA to RA shunting volume"],"a":4,"ex":"Same mechanism as P33: inspiration shrinks the left-to-right shunt."},
{"t":"q","id":"P35","src":"AC77","q":"Which mechanism is most effective at acutely and significantly increasing venous return to the right atrium in a healthy person?","o":["Deep inspiration","Arterial vasodilation","Decreased sympathetic tone","Standing upright quietly","Increased heart rate"],"a":0,"ex":"A deep breath drops intrathoracic pressure and raises abdominal pressure (thoracoabdominal pump), pulling blood into the chest. Standing still and lower sympathetic tone reduce venous return."}
]});
